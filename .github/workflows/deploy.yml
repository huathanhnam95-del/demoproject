name: Deploy to Firebase Hosting

on:
  workflow_run:
    workflows: ["RFIB Verify"]
    branches: ["main"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Build read-aloud connected speech index
        run: npm run build:read-aloud:connected-speech-index

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LISTENING_TASKS_3AE34 }}'

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --project listening-tasks-3ae34 --only hosting --non-interactive
