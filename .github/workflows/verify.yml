name: RFIB Verify

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run structure tests
        run: npm run test:structure

      - name: Run structure check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          ADOPTION_SHA: ffbc380ae0790d92eb904ddc6edb183748f00c06
        run: |
          set -euo pipefail

          sha_pattern='^[0-9a-fA-F]{40}$'
          zero_sha='0000000000000000000000000000000000000000'

          validate_sha() {
            local value="$1"
            local label="$2"
            if [[ ! "$value" =~ $sha_pattern ]]; then
              echo "Invalid $label: expected a 40-character hexadecimal commit SHA" >&2
              exit 2
            fi
          }

          ensure_commit() {
            local value="$1"
            local label="$2"
            if ! git cat-file -e "${value}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$value"; then
                echo "Unable to fetch required $label commit $value" >&2
                exit 2
              fi
            fi
            if ! git cat-file -e "${value}^{commit}" 2>/dev/null; then
              echo "Unable to resolve required $label commit $value" >&2
              exit 2
            fi
          }

          validate_sha "$ADOPTION_SHA" adoption
          ensure_commit "$ADOPTION_SHA" adoption

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PULL_REQUEST_BASE_SHA"
              validate_sha "$base_sha" pull-request-base
              ensure_commit "$base_sha" pull-request-base
              head_sha="$(git rev-parse HEAD)"
              validate_sha "$head_sha" checked-out-head
              node scripts/structure/check.cjs check --ci --base "$base_sha" --head "$head_sha" --json
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              if [[ "$base_sha" == "$zero_sha" ]]; then
                node scripts/structure/check.cjs check --ci --full --head "$(git rev-parse HEAD)" --json
              else
                validate_sha "$base_sha" push-before
                ensure_commit "$base_sha" push-before
                head_sha="$(git rev-parse HEAD)"
                validate_sha "$head_sha" checked-out-head
                node scripts/structure/check.cjs check --ci --base "$base_sha" --head "$head_sha" --json
              fi
              ;;
            workflow_dispatch)
              node scripts/structure/check.cjs check --ci --full --head "$(git rev-parse HEAD)" --json
              ;;
            *)
              echo "Unsupported workflow event for structure comparison: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Run release fixture suite
        run: npm run test:release

      - name: Run security and authorization boundary tests
        run: npm run test:security

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python test dependencies
        run: pip install requests

      - name: Run pronunciation lexical contract tests
        run: python -m unittest backend.test_pronunciation_reference -v

      - name: Run pronunciation campaign validation logic tests
        run: python -m unittest backend.test_pronunciation_audit -v

      - name: Run pronunciation frontend contract tests
        run: npm run test:pronounce:logic

      - name: Run entrance test scoring stability
        run: node tests/entrance-test-scoring-stability.test.js

      - name: Run entrance test ASR content-type normalization
        run: node tests/entrance-test-asr-content-type.test.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check RFIB dataset script syntax
        run: node --check scripts/build-rfib-dataset.js

      - name: Check RFIB frontend syntax
        run: node --check public/rfib-mode.js

      - name: Run RFIB content tests
        run: node tests/rfib-content-core.test.js

      - name: Rebuild RFIB dataset
        run: node scripts/build-rfib-dataset.js

      - name: Confirm RFIB dataset is committed cleanly
        run: git diff --exit-code -- public/database/RFIB/index.json public/database/RFIB/review-metadata.json

      - name: Run RFIB browser smoke
        run: node tests/browser/rfib-mode-browser-check.js

      - name: Run practice mode browser matrix
        run: node tests/browser/practice-modes-browser-check.js

      - name: Run UI Quality Audit
        run: npx -y impeccable detect public/ --no-advisory || true

      - name: Run pronunciation Chrome checks
        run: npm run test:pronounce:browser
