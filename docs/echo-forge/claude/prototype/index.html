<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Forge — Minimal Luminous Training Arena (Prototype)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ARIA Live Region (screen reader announcements) -->
  <div id="ef-aria-live" class="sr-only" aria-live="polite" role="status"></div>
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>

  <!-- Result flash overlay -->
  <div id="ef-result-flash" class="ef-result-flash" aria-hidden="true"></div>

  <main class="ef-stage" role="application" aria-roledescription="battle arena" aria-label="Echo Forge Training Arena">

    <!-- HUD -->
    <div class="ef-hud">
      <!-- Hero Health -->
      <div class="ef-health-group">
        <span class="ef-health-label">Hero</span>
        <div class="ef-health-bar" role="progressbar" aria-label="Hero health" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <div class="ef-health-fill ef-health-fill--hero" id="hero-health-fill" style="width: 100%"></div>
        </div>
        <span class="ef-health-value" id="hero-health-value">100/100</span>
      </div>

      <!-- Focus & Resonance Meters -->
      <div class="ef-meters">
        <div class="ef-meter">
          <span class="ef-meter-label">Focus</span>
          <div class="ef-meter-pips" role="meter" aria-label="Focus meter" aria-valuenow="0" aria-valuemin="0" aria-valuemax="5">
            <div class="ef-pip ef-pip--focus" aria-hidden="true"></div>
            <div class="ef-pip ef-pip--focus" aria-hidden="true"></div>
            <div class="ef-pip ef-pip--focus" aria-hidden="true"></div>
            <div class="ef-pip ef-pip--focus" aria-hidden="true"></div>
            <div class="ef-pip ef-pip--focus" aria-hidden="true"></div>
          </div>
        </div>
        <div class="ef-meter">
          <span class="ef-meter-label">Resonance</span>
          <div class="ef-meter-pips" role="meter" aria-label="Resonance gauge" aria-valuenow="0" aria-valuemin="0" aria-valuemax="5">
            <div class="ef-pip ef-pip--resonance" aria-hidden="true"></div>
            <div class="ef-pip ef-pip--resonance" aria-hidden="true"></div>
            <div class="ef-pip ef-pip--resonance" aria-hidden="true"></div>
            <div class="ef-pip ef-pip--resonance" aria-hidden="true"></div>
            <div class="ef-pip ef-pip--resonance" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <!-- Enemy Health -->
      <div class="ef-health-group ef-health-group--enemy">
        <span class="ef-health-label">Enemy</span>
        <div class="ef-health-bar" role="progressbar" aria-label="Enemy health" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <div class="ef-health-fill ef-health-fill--enemy" id="enemy-health-fill" style="width: 100%"></div>
        </div>
        <span class="ef-health-value" id="enemy-health-value">100/100</span>
      </div>
    </div>

    <!-- Recording Indicator -->
    <div id="ef-rec" class="ef-rec-indicator" aria-label="Recording status: inactive">
      <span class="ef-rec-dot"></span>
      <span>REC</span>
    </div>

    <!-- Arena -->
    <div class="ef-arena">
      <div class="ef-arena-floor"></div>

      <!-- Characters -->
      <div class="ef-characters">
        <!-- Hero -->
        <div class="ef-character ef-character--hero">
          <div class="ef-hero-sprite" aria-label="Hero character">
            <!-- Sound waves (visible during recording/attack) -->
            <div id="ef-sound-waves" class="ef-sound-waves">
              <div class="ef-sound-wave"></div>
              <div class="ef-sound-wave"></div>
              <div class="ef-sound-wave"></div>
              <div class="ef-sound-wave"></div>
              <div class="ef-sound-wave"></div>
            </div>
          </div>
        </div>

        <!-- Enemy -->
        <div class="ef-character ef-character--enemy">
          <div class="ef-enemy-sprite" aria-label="Training enemy"></div>
        </div>
      </div>

      <!-- Waveform Visualization -->
      <div id="ef-waveform" class="ef-waveform idle" aria-label="Pronunciation waveform">
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
        <div class="ef-waveform-bar"></div><div class="ef-waveform-bar"></div>
      </div>
    </div>

    <!-- Status Text -->
    <div id="ef-status" class="ef-status" role="status">
      <span class="ef-status-icon">⚔</span> Arena ready
    </div>

    <!-- Action Bar -->
    <div class="ef-action-bar" role="toolbar" aria-label="Combat actions">
      <button class="ef-action-btn ef-action-btn--attack" id="btn-attack" type="button" aria-label="Attack — Precision Strike">
        Attack
      </button>
      <button class="ef-action-btn ef-action-btn--block" id="btn-block" type="button" aria-label="Block — Stress Breaker">
        Block
      </button>
      <button class="ef-action-btn ef-action-btn--parry" id="btn-parry" type="button" aria-label="Parry — Echo Chain">
        Parry
      </button>
      <button class="ef-mic-btn" id="ef-mic-btn" type="button" aria-label="Toggle microphone recording">
        🎙
      </button>
    </div>

    <!-- Prototype Controls (development only) -->
    <div class="ef-controls" aria-label="Prototype controls">
      <label for="event-select">Event:</label>
      <select id="event-select" aria-label="Select contract event"></select>
      <button id="btn-prev" type="button" aria-label="Previous event">◀ Prev</button>
      <button id="btn-next" type="button" aria-label="Next event">Next ▶</button>
      <span id="current-event" style="font-size:11px;color:var(--ef-text-secondary);margin-left:8px"></span>
      <div class="ef-reduced-motion-toggle">
        <input type="checkbox" id="reduced-motion-toggle" aria-label="Toggle reduced motion mode">
        <label for="reduced-motion-toggle">Reduced motion</label>
      </div>
    </div>
  </main>

  <script src="states.js"></script>
</body>
</html>
