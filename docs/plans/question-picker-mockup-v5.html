<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Question Filter Picker Mockup v5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content {
            display: none;
        }

        .tab-active {
            display: block;
        }

        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
    </style>
</head>

<body class="bg-gray-50 h-screen font-sans antialiased text-gray-800 flex flex-col relative overflow-hidden">

    <!-- Sticky Control Bar -->
    <header
        class="bg-white border-b border-gray-200 px-3 md:px-4 py-3 flex items-center justify-between sticky top-0 z-10 shadow-sm shrink-0">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 rounded-md bg-blue-100 flex items-center justify-center text-blue-600 font-bold shrink-0">
                RA</div>
            <h1 class="font-semibold text-lg hidden lg:block shrink-0">Read Aloud</h1>
        </div>

        <!-- Center: Navigation -->
        <div class="flex flex-col items-center flex-1 mx-2 sm:mx-4 overflow-hidden">
            <div class="flex items-center bg-gray-50 rounded-full p-1 border border-gray-200 shadow-sm min-w-0">
                <!-- Disabled explicitly to show it requires history/stack -->
                <button id="ra-prev-btn" disabled title="Previous Question"
                    class="w-8 h-8 rounded-full hover:bg-white hover:shadow-sm flex items-center justify-center transition focus:outline-none text-gray-400 hover:text-gray-900 shrink-0 opacity-50 cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                </button>

                <button id="ra-question-pill" onclick="toggleSheet('jump')"
                    class="px-2 sm:px-3 font-medium text-sm w-32 sm:w-48 text-center truncate hover:text-blue-600 transition focus:outline-none">
                    #42 - The Water Cycle
                </button>

                <select id="ra-question-select" class="hidden" aria-hidden="true">
                    <option value="41">#41 - Atmospheric Layers</option>
                    <option value="42" selected>#42 - The Water Cycle</option>
                    <option value="43">#43 - Solar Energy Impact</option>
                </select>

                <button id="ra-next-btn" title="Next Question"
                    class="w-8 h-8 rounded-full hover:bg-white hover:shadow-sm flex items-center justify-center transition focus:outline-none text-gray-400 hover:text-gray-900 shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Right: Actions & Primary Button -->
        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
            <span
                class="hidden xl:inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 text-gray-700 border border-gray-200">
                Status: Mastered
                <button aria-label="Remove Status filter"
                    class="hover:bg-gray-200 rounded-full p-0.5 text-gray-400 hover:text-gray-600 focus:outline-none"><svg
                        class="w-3 h-3" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg></button>
            </span>

            <button onclick="toggleSheet('filter')"
                class="header-filters-btn flex items-center gap-2 px-2 sm:px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shrink-0">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z">
                    </path>
                </svg>
                <span class="hidden md:inline">Filters</span>
                <span
                    class="flex items-center justify-center w-5 h-5 ml-1 text-xs text-white bg-blue-600 rounded-full">1</span>
            </button>

            <div class="hidden sm:flex items-center border-l border-gray-200 pl-2 sm:pl-3 gap-1 sm:gap-2">
                <button id="header-ra-play-audio-btn" title="Play Sample"
                    class="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center bg-gray-100 text-gray-600 hover:bg-blue-50 hover:text-blue-600 rounded-full transition focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <button id="header-ra-play-recording-btn" title="Your Playback"
                    class="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center bg-gray-100 text-gray-400 hover:text-gray-600 rounded-full transition cursor-not-allowed focus:outline-none"
                    disabled>
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <button onclick="toggleMobileActions()"
                class="sm:hidden w-8 h-8 flex items-center justify-center bg-gray-50 border border-gray-200 text-gray-600 rounded-lg focus:outline-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z">
                    </path>
                </svg>
            </button>

            <!-- Buttons use data-label inside span to stop JS from overwriting the SVG -->
            <button id="ra-record-btn"
                class="flex items-center gap-2 px-3 sm:px-4 py-2 text-sm font-semibold text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition shrink-0 shadow-sm">
                <svg class="w-4 h-4 hidden sm:block" aria-hidden="true" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z">
                    </path>
                </svg>
                <span class="hidden sm:inline" data-label>Start Recording</span>
                <span class="sm:hidden" data-label-short>Start</span>
            </button>

            <button id="ra-stop-btn"
                class="hidden items-center gap-2 px-3 sm:px-4 py-2 text-sm font-semibold text-white bg-red-600 border border-transparent rounded-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition shrink-0 shadow-sm">
                <svg class="w-4 h-4 hidden sm:block" aria-hidden="true" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                </svg>
                <span class="hidden sm:inline" data-label>Stop Recording</span>
                <span class="sm:hidden" data-label-short>Stop</span>
            </button>
        </div>

        <!-- Mobile Mini Dropdown for Audio Actions -->
        <div id="mobile-actions-menu"
            class="absolute top-14 right-4 bg-white border border-gray-200 shadow-lg rounded-xl p-2 hidden flex-col gap-2 z-50">
            <button
                class="flex items-center gap-3 w-full px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg text-left">
                <svg class="w-5 h-5 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                        clip-rule="evenodd" />
                </svg>
                Play Sample
            </button>
            <button disabled
                class="flex items-center gap-3 w-full px-3 py-2 text-sm text-gray-400 hover:bg-gray-50 rounded-lg text-left cursor-not-allowed">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z"
                        clip-rule="evenodd" />
                </svg>
                Your Playback
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-auto p-4 md:p-12 relative flex flex-col items-center select-text focus:outline-none"
        tabindex="-1">
        <div class="w-full max-w-4xl bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 min-h-[500px]">
            <div class="flex items-center justify-between mb-8 gap-4 flex-wrap">
                <h2
                    class="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600 leading-tight">
                    The Water Cycle</h2>
                <span
                    class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-yellow-100 text-yellow-800 border border-yellow-200 border-l-4 border-l-yellow-500 shrink-0">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    In Progress
                </span>
            </div>
            <div class="animate-pulse flex space-x-4 max-w-3xl">
                <div class="flex-1 space-y-6 py-1">
                    <div class="h-4 bg-gray-200 rounded w-full"></div>
                    <div class="h-4 bg-gray-200 rounded w-11/12"></div>
                    <div class="h-4 bg-gray-200 rounded w-full"></div>
                    <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                    <div class="h-4 bg-gray-200 rounded w-4/6"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Overlay/Sheet Backdrop -->
    <div id="sheet-backdrop"
        class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-20 hidden transition-opacity duration-300"
        onclick="closeSheet()"></div>

    <!-- Shared Sheet -->
    <div id="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" class="fixed z-30 bg-white shadow-2xl transition-transform duration-300 transform 
                                top-auto bottom-0 right-0 h-[85vh] w-full 
                                sm:top-0 sm:bottom-auto sm:h-full sm:w-[500px] 
                                translate-y-full sm:translate-y-0 sm:translate-x-full 
                                flex flex-col sm:rounded-none rounded-t-2xl outline-none">

        <div
            class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white shrink-0 sm:rounded-none rounded-t-2xl">
            <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-12 h-1.5 bg-gray-200 rounded-full sm:hidden"
                aria-hidden="true"></div>
            <h2 id="sheet-title" class="text-xl font-semibold text-gray-800 mt-2 sm:mt-0">Jump & Filter</h2>
            <button onclick="closeSheet()" aria-label="Close dialog"
                class="sheet-close-btn p-2 mt-2 sm:mt-0 text-gray-400 hover:text-gray-800 hover:bg-gray-100 rounded-full transition focus:outline-none focus:ring-2 focus:ring-blue-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <div class="flex px-4 border-b border-gray-100 font-medium text-sm text-gray-500 shrink-0" role="tablist">
            <button id="tab-btn-jump" role="tab" aria-selected="true" aria-controls="tab-jump"
                onclick="switchTab('jump')"
                class="flex-1 py-3 border-b-2 border-blue-600 text-blue-600 focus:outline-none transition">
                Jump
            </button>
            <button id="tab-btn-filter" role="tab" aria-selected="false" aria-controls="tab-filter"
                onclick="switchTab('filter')"
                class="flex-1 py-3 border-b-2 border-transparent hover:text-gray-800 hover:border-gray-200 focus:outline-none transition relative">
                Filters
                <span class="absolute top-3 pl-1 inline-flex h-2 w-2 rounded-full bg-blue-500"></span>
            </button>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto bg-gray-50/50 safe-pb" id="sheet-content-scroll">

            <!-- JUMP TAB -->
            <div id="tab-jump" role="tabpanel" tabindex="0" aria-labelledby="tab-btn-jump"
                class="tab-content tab-active p-6 space-y-8 focus:outline-none">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="search" id="jump-search" aria-label="Search questions"
                        class="block w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition shadow-sm text-gray-900"
                        placeholder="Search by ID, title, or excerpt...">
                </div>

                <div class="space-y-3">
                    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Quick Navigation</h3>
                    <div class="flex flex-wrap gap-2">
                        <button
                            class="inline-flex items-center px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700 hover:bg-blue-100 transition border border-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg> Recommended Next
                        </button>
                        <button
                            class="inline-flex items-center px-4 py-2 rounded-lg text-sm font-medium bg-white text-gray-700 hover:bg-gray-50 transition border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
                            <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                </path>
                            </svg> Random Question
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <h3
                        class="text-xs font-semibold text-gray-500 uppercase tracking-widest flex items-center justify-between">
                        <span>Matching Questions</span>
                        <span class="text-blue-600 lowercase bg-blue-50 px-2 py-0.5 rounded text-[10px]">142
                            results</span>
                    </h3>
                    <div
                        class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm divide-y divide-gray-100">
                        <button
                            class="w-full text-left px-5 py-4 hover:bg-gray-50 focus:bg-blue-50 focus:outline-none flex flex-col transition group border-l-4 border-transparent">
                            <div class="flex items-center justify-between w-full mb-1">
                                <span class="text-sm font-medium text-gray-800 group-hover:text-blue-600 transition">#41
                                    - Atmospheric Layers</span>
                                <span
                                    class="text-[10px] font-bold px-2 py-0.5 rounded-sm bg-yellow-100 text-yellow-700 uppercase tracking-wider">In
                                    Progress</span>
                            </div>
                            <p class="text-xs text-gray-500 truncate w-full mt-1">The Earth's atmosphere is composed of
                                several distinct layers...</p>
                        </button>
                        <button
                            class="w-full text-left px-5 py-4 bg-blue-50/30 focus:outline-none flex flex-col transition border-l-4 border-blue-500">
                            <div class="flex items-center justify-between w-full mb-1">
                                <span class="text-sm font-semibold text-blue-900">#42 - The Water Cycle</span>
                                <span
                                    class="text-[10px] font-bold px-2 py-0.5 rounded-sm bg-gray-200 text-gray-700 uppercase tracking-wider">Current</span>
                            </div>
                            <p class="text-xs text-gray-500 truncate w-full mt-1">The water cycle describes the
                                continuous movement of water on...</p>
                        </button>
                    </div>
                </div>
            </div>

            <!-- FILTER TAB -->
            <div id="tab-filter" role="tabpanel" tabindex="0" aria-labelledby="tab-btn-filter"
                class="tab-content p-6 space-y-10 focus:outline-none">

                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-semibold text-gray-900 uppercase tracking-widest">Status</h3>
                        <span class="text-xs text-gray-500">Select multiple</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <label
                            class="flex items-center p-3 border border-gray-200 bg-white rounded-xl cursor-pointer hover:border-gray-300 hover:shadow-sm transition">
                            <input type="checkbox"
                                class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500"
                                tabindex="-1">
                            <span class="ml-3 text-sm text-gray-700 font-medium">Not Started</span>
                        </label>
                        <label
                            class="flex items-center p-3 border border-gray-200 bg-white rounded-xl cursor-pointer hover:border-gray-300 hover:shadow-sm transition">
                            <input type="checkbox"
                                class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500"
                                tabindex="-1">
                            <span class="ml-3 text-sm text-gray-700 font-medium">In Progress</span>
                        </label>
                        <label
                            class="flex items-center p-3 border border-gray-200 bg-white rounded-xl cursor-pointer hover:border-gray-300 hover:shadow-sm transition">
                            <input type="checkbox"
                                class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500"
                                tabindex="-1">
                            <span class="ml-3 text-sm text-gray-700 font-medium">Completed</span>
                        </label>
                        <label
                            class="flex items-center p-3 border border-gray-200 bg-white rounded-xl cursor-pointer hover:border-gray-300 hover:shadow-sm transition">
                            <input type="checkbox"
                                class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500"
                                tabindex="-1">
                            <span class="ml-3 text-sm text-gray-700 font-medium">Consolidated</span>
                        </label>
                        <label
                            class="flex items-center p-3 border-2 border-purple-500 bg-purple-50 rounded-xl cursor-pointer transition col-span-2">
                            <input type="checkbox" checked
                                class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500"
                                tabindex="-1">
                            <span class="ml-3 text-sm text-purple-800 font-semibold">Mastered</span>
                        </label>
                    </div>
                </div>

                <fieldset>
                    <legend class="text-sm font-semibold text-gray-900 mb-4 uppercase tracking-widest block w-full">
                        Sample Audio</legend>
                    <div class="flex bg-gray-100 rounded-xl p-1 border border-gray-200 shadow-inner">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="sampleAudio" value="any" class="sr-only peer">
                            <div
                                class="py-2 px-3 rounded-lg text-sm font-medium text-gray-600 peer-checked:bg-white peer-checked:shadow-sm peer-checked:font-bold peer-checked:text-gray-800 hover:text-gray-900 transition">
                                Any</div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="sampleAudio" value="has" checked class="sr-only peer">
                            <div
                                class="py-2 px-3 rounded-lg text-sm font-medium text-gray-600 peer-checked:bg-white peer-checked:shadow-sm peer-checked:font-bold peer-checked:text-gray-800 hover:text-gray-900 transition">
                                Has Sample</div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="sampleAudio" value="none" class="sr-only peer">
                            <div
                                class="py-2 px-3 rounded-lg text-sm font-medium text-gray-600 peer-checked:bg-white peer-checked:shadow-sm peer-checked:font-bold peer-checked:text-gray-800 hover:text-gray-900 transition">
                                None</div>
                        </label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend class="text-sm font-semibold text-gray-900 mb-4 uppercase tracking-widest block w-full">
                        Difficulty</legend>
                    <div class="flex bg-gray-100 rounded-xl p-1 border border-gray-200 shadow-inner">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="difficulty" value="any" checked class="sr-only peer">
                            <div
                                class="py-2 px-2 rounded-lg text-sm font-bold text-gray-800 peer-checked:bg-white peer-checked:shadow-sm peer-checked:font-bold peer-checked:text-gray-800 hover:text-gray-900 transition">
                                Any</div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="difficulty" value="easy" class="sr-only peer">
                            <div
                                class="py-2 px-2 rounded-lg text-sm font-medium text-gray-600 peer-checked:bg-white peer-checked:shadow-sm peer-checked:font-bold hover:text-gray-900 transition">
                                Easy</div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="difficulty" value="medium" class="sr-only peer">
                            <div
                                class="py-2 px-2 rounded-lg text-sm font-medium text-gray-600 peer-checked:bg-white peer-checked:shadow-sm peer-checked:font-bold hover:text-gray-900 transition">
                                Medium</div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="difficulty" value="hard" class="sr-only peer">
                            <div
                                class="py-2 px-2 rounded-lg text-sm font-medium text-gray-600 peer-checked:bg-white peer-checked:shadow-sm peer-checked:font-bold hover:text-gray-900 transition">
                                Hard</div>
                        </label>
                    </div>
                </fieldset>

                <!-- Prompt Features (Read Aloud Specific) -->
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-semibold text-gray-900 uppercase tracking-widest">Prompt Features</h3>
                        <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded uppercase">RA
                            Specific</span>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button aria-pressed="true"
                            class="px-3 py-1.5 border border-blue-500 bg-blue-50 text-blue-700 text-sm font-medium rounded-full transition shadow-sm flex items-center gap-1 focus:outline-none focus:ring-2 focus:ring-blue-500">Any
                            connected speech <span class="text-blue-400 font-bold"
                                aria-hidden="true">&times;</span></button>
                        <button aria-pressed="false"
                            class="px-3 py-1.5 border border-gray-200 bg-white text-gray-600 hover:text-gray-800 text-sm font-medium rounded-full transition focus:outline-none focus:ring-2 focus:ring-gray-400">Linking</button>
                        <button aria-pressed="false"
                            class="px-3 py-1.5 border border-gray-200 bg-white text-gray-600 hover:text-gray-800 text-sm font-medium rounded-full transition focus:outline-none focus:ring-2 focus:ring-gray-400">Reduced
                            words</button>
                        <button aria-pressed="false"
                            class="px-3 py-1.5 border border-gray-200 bg-white text-gray-600 hover:text-gray-800 text-sm font-medium rounded-full transition focus:outline-none focus:ring-2 focus:ring-gray-400">Sound
                            changes</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Sheet Footer -->
        <div id="filter-footer"
            class="p-4 border-t border-gray-100 bg-white hidden shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] safe-pb">
            <div class="flex gap-3">
                <button
                    class="px-4 py-3 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition w-1/3">
                    Clear
                </button>
                <button onclick="closeSheet()"
                    class="sheet-apply-btn px-4 py-3 text-sm font-semibold text-white bg-blue-600 border border-transparent rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition w-2/3 shadow-sm">
                    Apply Filters
                </button>
            </div>
        </div>

    </div>

    <script>
        let triggerElement = null;
        let focusTrapHandler = null;

        function toggleMobileActions() {
            const menu = document.getElementById('mobile-actions-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        document.addEventListener('click', function (event) {
            const menu = document.getElementById('mobile-actions-menu');
            const actionBtn = event.target.closest('button[onclick="toggleMobileActions()"]');
            if (!actionBtn && !menu.contains(event.target)) {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                const sheet = document.getElementById('filter-sheet');
                if (sheet.classList.contains('translate-y-0') || !sheet.classList.contains('sm:translate-x-full')) {
                    closeSheet();
                }
            }
        });

        // Improved dynamic focus trap
        function refreshFocusTrap() {
            const sheet = document.getElementById('filter-sheet');

            if (focusTrapHandler) {
                sheet.removeEventListener('keydown', focusTrapHandler);
            }

            // Query ONLY visible focusable elements within the sheet
            const focusableElements = Array.from(sheet.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
                .filter(el => {
                    return el.offsetWidth > 0 && el.offsetHeight > 0 &&
                        !el.hasAttribute('disabled') &&
                        // Make sure it's not inside a hidden tab
                        window.getComputedStyle(el).display !== 'none' &&
                        !el.closest('.tab-content:not(.tab-active)') &&
                        !el.closest('#filter-footer.hidden');
                });

            if (focusableElements.length === 0) return;

            const firstElement = focusableElements[0];
            const lastElement = focusableElements[focusableElements.length - 1];

            focusTrapHandler = function (e) {
                if (e.key === 'Tab') {
                    if (e.shiftKey) {
                        if (document.activeElement === firstElement) {
                            lastElement.focus();
                            e.preventDefault();
                        }
                    } else {
                        if (document.activeElement === lastElement) {
                            firstElement.focus();
                            e.preventDefault();
                        }
                    }
                }
            };
            sheet.addEventListener('keydown', focusTrapHandler);
        }

        function toggleSheet(targetTab) {
            triggerElement = document.activeElement;
            const sheet = document.getElementById('filter-sheet');
            const backdrop = document.getElementById('sheet-backdrop');

            const isOpen = sheet.classList.contains('translate-y-0') || !sheet.classList.contains('sm:translate-x-full');

            if (!isOpen) {
                sheet.classList.remove('translate-y-full', 'sm:translate-x-full');
                sheet.classList.add('translate-y-0', 'sm:translate-x-0');
                backdrop.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            if (targetTab) switchTab(targetTab);
        }

        function closeSheet() {
            const sheet = document.getElementById('filter-sheet');
            const backdrop = document.getElementById('sheet-backdrop');

            sheet.classList.remove('translate-y-0', 'sm:translate-x-0');
            sheet.classList.add('translate-y-full', 'sm:translate-x-full');
            setTimeout(() => backdrop.classList.add('hidden'), 300);
            document.body.style.overflow = '';

            if (focusTrapHandler) sheet.removeEventListener('keydown', focusTrapHandler);
            focusTrapHandler = null;

            if (triggerElement && triggerElement.focus) triggerElement.focus();
        }

        function switchTab(tabId) {
            document.getElementById('tab-jump').classList.remove('tab-active');
            document.getElementById('tab-filter').classList.remove('tab-active');

            const btnJump = document.getElementById('tab-btn-jump');
            const btnFilter = document.getElementById('tab-btn-filter');
            btnJump.setAttribute('aria-selected', 'false');
            btnFilter.setAttribute('aria-selected', 'false');

            btnJump.className = 'flex-1 py-3 border-b-2 border-transparent text-gray-600 hover:text-gray-800 hover:border-gray-200 focus:outline-none transition relative';
            btnFilter.className = 'flex-1 py-3 border-b-2 border-transparent text-gray-600 hover:text-gray-800 hover:border-gray-200 focus:outline-none transition relative';

            document.getElementById(`tab-${tabId}`).classList.add('tab-active');
            const activeBtn = document.getElementById(`tab-btn-${tabId}`);
            activeBtn.setAttribute('aria-selected', 'true');
            activeBtn.className = 'flex-1 py-3 border-b-2 border-blue-600 text-blue-600 focus:outline-none transition font-semibold relative';

            const footer = document.getElementById('filter-footer');
            if (tabId === 'filter') {
                footer.classList.remove('hidden');
            } else {
                footer.classList.add('hidden');
            }

            // Update trap array for new visible elements and set focus
            setTimeout(() => {
                refreshFocusTrap();
                if (tabId === 'jump') {
                    const input = document.getElementById('jump-search');
                    if (input) input.focus();
                } else if (tabId === 'filter') {
                    // Let screen readers catch up before moving focus
                    document.getElementById('tab-filter').focus();
                }
            }, 50);
        }
    </script>
</body>

</html>
