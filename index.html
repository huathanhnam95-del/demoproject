<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictation Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Dictation Practice</h1>

    <div class="controls">
      <button id="play-btn" type="button">Play</button>
      <button id="check-btn" type="button">Check</button>
    </div>

    <label class="input-label" for="answer-input">Type what you hear:</label>
    <textarea id="answer-input" rows="4" placeholder="Start typing..."></textarea>

    <div id="result" aria-live="polite"></div>
  </main>

  <audio id="audio" src="1.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
