<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Length Filter icon">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="lg-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="lg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="9" y="9" width="110" height="110" rx="20" fill="url(#lg-bg)" stroke="#0f172a" stroke-width="4" filter="url(#lg-shadow)"/>
  <rect x="20" y="78" width="88" height="16" rx="8" fill="url(#lg-metal)" stroke="#0f172a" stroke-width="2"/>
  <rect x="28" y="36" width="72" height="24" rx="8" fill="#ffffff" stroke="#334155" stroke-width="3"/>

  <rect x="34" y="41" width="4" height="14" fill="#0f172a"/>
  <rect x="42" y="44" width="2" height="11" fill="#0f172a"/>
  <rect x="50" y="41" width="4" height="14" fill="#0f172a"/>
  <rect x="58" y="44" width="2" height="11" fill="#0f172a"/>
  <rect x="66" y="41" width="4" height="14" fill="#0f172a"/>
  <rect x="74" y="44" width="2" height="11" fill="#0f172a"/>
  <rect x="82" y="41" width="4" height="14" fill="#0f172a"/>
  <rect x="90" y="44" width="2" height="11" fill="#0f172a"/>

  <rect x="25" y="81" width="16" height="10" rx="5" fill="#22c55e"/>
  <rect x="47" y="81" width="20" height="10" rx="5" fill="#38bdf8"/>
  <rect x="73" y="81" width="30" height="10" rx="5" fill="#f59e0b"/>

  <circle cx="24" cy="24" r="7" fill="#ffffff" fill-opacity="0.65"/>
</svg>
