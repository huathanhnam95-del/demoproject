<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Stealth enemy (in-game style)">
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ede4"/>
      <stop offset="1" stop-color="#d7d1c6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="32" fill="url(#tileBg)"/>
  <rect x="0" y="0" width="256" height="256" rx="32" fill="none" stroke="rgba(15,23,42,0.10)" stroke-width="2"/>

  <!-- Enemy body (Drone ring, Renderer default) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="128" r="66" stroke="#b24c4c" stroke-width="12" opacity="0.18"/>
    <circle cx="128" cy="128" r="66" stroke="#b24c4c" stroke-width="3.5" opacity="0.88"/>
  </g>

  <!-- Stealth beaded ring (matches Renderer 'beaded circle' marker) -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="#b24c4c" stroke-width="2.5" opacity="0.28"/>
  <g fill="#b24c4c" opacity="0.55">
    <circle cx="128.0" cy="42.0" r="5"/>
    <circle cx="178.5" cy="58.4" r="5"/>
    <circle cx="209.8" cy="101.4" r="5"/>
    <circle cx="209.8" cy="154.6" r="5"/>
    <circle cx="178.5" cy="197.6" r="5"/>
    <circle cx="128.0" cy="214.0" r="5"/>
    <circle cx="77.5" cy="197.6" r="5"/>
    <circle cx="46.2" cy="154.6" r="5"/>
    <circle cx="46.2" cy="101.4" r="5"/>
    <circle cx="77.5" cy="58.4" r="5"/>
  </g>
</svg>

