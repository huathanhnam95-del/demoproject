<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Survival controls">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect x="14" y="14" width="612" height="332" rx="26" fill="url(#bg2)" />

  <!-- Keycap helper -->
  <g>
    <rect x="86" y="104" width="150" height="90" rx="18" fill="#111827" stroke="#94a3b8" stroke-width="2" opacity="0.95"/>
    <rect x="250" y="104" width="190" height="90" rx="18" fill="#111827" stroke="#94a3b8" stroke-width="2" opacity="0.95"/>
    <rect x="454" y="104" width="100" height="90" rx="18" fill="#111827" stroke="#94a3b8" stroke-width="2" opacity="0.95"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" fill="#e2e8f0">
    <text x="161" y="152" text-anchor="middle" font-size="28" font-weight="700">A B C</text>
    <text x="345" y="145" text-anchor="middle" font-size="24" font-weight="700">BACKSPACE</text>
    <text x="504" y="152" text-anchor="middle" font-size="26" font-weight="700">CTRL</text>
  </g>

  <!-- Arrows to actions -->
  <g fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M160 206c0 34 46 58 92 58"/>
    <path d="M256 264l-18-12 18-12"/>
    <path d="M345 206c0 34 0 58-20 58"/>
    <path d="M326 264l-18-12 18-12"/>
    <path d="M504 206c0 34-46 58-92 58"/>
    <path d="M388 264l18-12-18-12"/>
  </g>

  <!-- Action labels -->
  <g font-family="Outfit, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" fill="#f1f5f9">
    <text x="270" y="292" font-size="14" opacity="0.75">Type letters to lock a target</text>
    <text x="280" y="312" font-size="14" opacity="0.75">Backspace clears lock</text>
    <text x="360" y="332" font-size="14" opacity="0.75">Ctrl opens Level Up</text>
  </g>
</svg>
