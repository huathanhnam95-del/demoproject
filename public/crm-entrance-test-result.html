<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CRM Admin - Entrance Test Result</title>

  <!-- Use system serif/Times New Roman only -->


  <!-- Reuse CRM admin design system -->
  <!-- style.css and crm-admin.css both resolve tokens from here; this page was the only
       one loading them without it. -->
  <link rel="stylesheet" href="/design-tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="crm-admin.css?v=20260909-v2.0.3" />
  <link rel="stylesheet" href="crm-entrance-test-result.css?v=20260909-v2.0.3" />
</head>

<body>
  <div class="crm-admin">
    <header class="crm-header">
      <div class="crm-header-left">
        <div class="crm-logo-box">
          <img src="/database/Logo.png" alt="BEL" class="crm-logo-img">
        </div>

        <div class="crm-result-heading">
          <div class="crm-result-title">Entrance Test Result</div>
          <div id="crm-result-subtitle" class="crm-result-subtitle">Loading…</div>
        </div>
      </div>

      <div class="crm-header-right">
        <div class="crm-header-actions crm-result-header-actions">
          <span id="crm-result-user-email" class="crm-result-user-email"></span>
          <button id="crm-export-pdf-btn" class="crm-export-btn" style="display:none"
            onclick="window.__exportResultPdf && window.__exportResultPdf()">📄 Export PDF</button>
          <a class="crm-result-back-link" href="crm-admin.html" rel="noopener">← Back to CRM</a>
        </div>
      </div>
    </header>

    <main class="crm-content" aria-live="polite">
      <section class="crm-panel">
        <div id="crm-result-root" class="crm-result-root">
          <div class="crm-placeholder-card">Loading…</div>
        </div>
      </section>
    </main>
  </div>

  <!-- Loading / Access Gate -->
  <div id="crm-loading" class="crm-loading-overlay" aria-live="polite">
    <div class="crm-loading-card">
      <div class="crm-spinner" aria-hidden="true"></div>
      <div id="crm-loading-text" class="crm-loading-text">Checking admin access…</div>
      <div id="crm-loading-subtext" class="crm-loading-subtext">Please wait</div>
    </div>
  </div>

  <!-- html2pdf.js for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

  <!-- Firebase compat SDKs (admin pages use compat like CRM Admin) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script src="js/auth-session-guard.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="entrance-test-pdf-generator.js?v=20260909-v2.0.3"></script>
  <script src="phonetics.js?v=20260909-v2.0.3"></script>
  <script src="crm-entrance-test-result.js?v=20260909-v2.0.3"></script>
</body>

</html>
