<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Entrance Test UI Lab</title>

  <!--
    INTERACTIVE PROTOTYPE — not wired to the API, not linked from anywhere.

    Combines the three directions picked from the design canvas:
      E  answer-sheet flow  — free navigation between all 13 questions, flag for
                              review, continuous autosave, one final submit
                              behind a review screen.
      F  split view         — the passage keeps a clean measure on the left and
                              never reflows; every control lives in a right rail.
      B  instrument skin    — near-black chrome over a white sheet, Space Grotesk
                              with JetBrains Mono on every figure, one signal
                              green used only for state.

    Content is copied verbatim from functions/src/entrance-test/test36plus.js.
    Answers and flags persist to localStorage; speaking takes are in-memory only.
    Press the TEST button (bottom left) for the QA shortcuts.
  -->

  <script src="js/entrance-test-ui-fonts.js"></script>
  <script>
    // Applied before the stylesheet paints so the skin never flashes.
    (function () {
      var p = new URLSearchParams(location.search);
      var skin = (p.get('skin') || 'b').toLowerCase();
      if (['a', 'b', 'c'].indexOf(skin) === -1) skin = 'b';
      document.documentElement.setAttribute('data-skin', skin);
      window.__ET_SKIN__ = skin;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Same faces the CRM loads. Be Vietnam Pro carries the Vietnamese
       diacritics properly; Space Grotesk did not. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">

  <style>
    /* ── Shared metrics and semantics ─────────────────────────────────
       Three skins, one engine. Everything that differs between direction
       A, B and C is a token below; the markup and behaviour are identical,
       so a rater is comparing looks, not two different products. */
    :root {
      --nav-w: 264px;
      --rail-w: 400px;
      --bar-h: 56px;
      --foot-h: 72px;

      /* Vietnamese UI text is Be Vietnam Pro in every skin — it is the CRM's
         face (crm-admin.css:73) and the only one here with full diacritics. */
      --sans: 'Be Vietnam Pro', 'Outfit', sans-serif;
      --mono: 'Roboto Mono', ui-monospace, monospace;

      --ok: #22c55e;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --warn-line: #fcd34d;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-line: #fca5a5;
    }

    /* ── B · Instrument (default) ─────────────────────────────────────── */
    :root,
    [data-skin="b"] {
      --ink: #18181b;
      --ink-2: #3f3f46;
      --muted: #71717a;
      --faint: #a1a1aa;
      --ghost: #d4d4d8;
      --line: #e4e4e7;
      --line-2: #f4f4f5;
      --surface: #ffffff;
      --surface-2: #fcfcfd;
      --app-bg: #ffffff;
      --chrome-bg: #0a0b0d;
      --chrome-fg: #fafafa;
      --chrome-dim: rgba(250, 250, 250, 0.5);
      --chrome-line: rgba(255, 255, 255, 0.18);
      --chrome-soft: rgba(255, 255, 255, 0.18);
      --accent: #00e08f;
      --on-accent: #0a0b0d;
      --serif: 'Lora', Georgia, serif;
      --radius: 3px;
      --bw: 1px;
      --bw2: 1.5px;
      --hard: none;
      --label-ls: 0.16em;
      --passage-weight: 400;
    }

    /* ── A · Editorial ────────────────────────────────────────────────── */
    [data-skin="a"] {
      --ink: #16150f;
      --ink-2: #3d3a30;
      --muted: #6b6759;
      --faint: #a79e88;
      --ghost: #c9c2b0;
      --line: #ded8c9;
      --line-2: #ece7db;
      --surface: #fbfaf7;
      --surface-2: #f6f3ec;
      --app-bg: #fbfaf7;
      --chrome-bg: #fbfaf7;
      --chrome-fg: #16150f;
      --chrome-dim: #6b6759;
      --chrome-line: #16150f;
      --chrome-soft: #cfc7b4;
      --accent: #8c2f1e;
      --on-accent: #fbfaf7;
      --serif: 'Newsreader', Georgia, serif;
      --radius: 2px;
      --bw: 1px;
      --bw2: 1px;
      --hard: none;
      --label-ls: 0.2em;
      --passage-weight: 400;
    }

    /* ── C · Signal ───────────────────────────────────────────────────── */
    [data-skin="c"] {
      --ink: #101010;
      --ink-2: #3d3a33;
      --muted: #5c584f;
      --faint: #8a857a;
      --ghost: #c4bfb2;
      --line: #101010;
      --line-2: #efece3;
      --surface: #ffffff;
      --surface-2: #faf8f2;
      --app-bg: #f2efe6;
      --chrome-bg: #101010;
      --chrome-fg: #f2efe6;
      --chrome-dim: rgba(242, 239, 230, 0.62);
      --chrome-line: rgba(242, 239, 230, 0.25);
      --chrome-soft: rgba(242, 239, 230, 0.28);
      --accent: #e8380d;
      --on-accent: #fff6f2;
      --serif: 'Archivo', system-ui, sans-serif;
      --radius: 0px;
      --bw: 2px;
      --bw2: 2px;
      --hard: 4px 4px 0 0 var(--accent);
      --label-ls: 0.16em;
      --passage-weight: 400;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--app-bg);
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; }

    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .app { display: flex; flex-direction: column; height: 100%; }

    /* ── Instrument bar ─────────────────────────────────────────────── */

    .bar {
      display: flex;
      align-items: center;
      height: var(--bar-h);
      flex-shrink: 0;
      background: var(--chrome-bg);
      color: var(--chrome-fg);
      border-bottom: var(--bw) solid var(--chrome-line);
    }

    .bar-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      width: var(--nav-w);
      flex-shrink: 0;
      padding-left: 40px;
    }

    .bar-brand img { width: 18px; height: 18px; display: block; }

    .bar-brand span {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: var(--chrome-fg);
      white-space: nowrap;
    }

    .bar-mid { display: flex; align-items: center; gap: 20px; flex-grow: 1; min-width: 0; }

    .bar-section {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--accent);
      white-space: nowrap;
    }

    .ticks { display: flex; align-items: center; gap: 14px; }
    .tick-group { display: flex; align-items: center; gap: 5px; }
    .tick { display: block; width: 2px; height: 14px; background: var(--chrome-soft); }
    .tick.is-done { background: var(--accent); }
    .tick.is-current { height: 22px; background: var(--accent); }

    .bar-counter {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      color: var(--chrome-dim);
      white-space: nowrap;
    }

    .bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      padding-right: 40px;
    }

    .saved { display: flex; align-items: center; gap: 8px; }
    .saved-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

    .saved-text {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      color: var(--chrome-dim);
      white-space: nowrap;
    }

    .bar-sep { width: 1px; height: 18px; background: var(--chrome-soft); }

    .btn-submit-top {
      height: 32px;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--on-accent);
      font-size: 13px;
      font-weight: 500;
    }

    .btn-submit-top { box-shadow: var(--hard); }
    .btn-submit-top:hover { filter: brightness(1.08); }

    /* ── Body ───────────────────────────────────────────────────────── */

    .body { display: flex; flex-grow: 1; min-height: 0; }

    /* ── E · question navigator ─────────────────────────────────────── */

    .nav {
      display: flex;
      flex-direction: column;
      width: var(--nav-w);
      flex-shrink: 0;
      padding: 8px 10px 16px;
      border-right: var(--bw) solid var(--line);
      background: var(--surface-2);
      overflow-y: auto;
    }

    .nav-head {
      padding: 16px 14px 7px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: var(--faint);
    }

    .nav-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 32px;
      padding: 0 14px;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      text-align: left;
    }

    .nav-row:hover { background: var(--line-2); }
    .nav-row.is-current { background: var(--line-2); }

    .nav-num {
      width: 16px;
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
    }

    .nav-glyph { width: 8px; height: 8px; flex-shrink: 0; border: var(--bw) solid var(--ghost); }
    .nav-row.is-answered .nav-glyph { border-color: var(--ink); background: var(--ink); }
    .nav-row.is-partial .nav-glyph { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
    .nav-row.is-current .nav-glyph { border: 2px solid var(--ink); background: transparent; }

    .nav-label { flex-grow: 1; font-size: 13.5px; color: var(--faint); }
    .nav-row.is-answered .nav-label, .nav-row.is-partial .nav-label { color: var(--ink); }
    .nav-row.is-current .nav-label { color: var(--ink); font-weight: 500; }

    .nav-flag { flex-shrink: 0; color: var(--muted); display: none; }
    .nav-row.is-flagged .nav-flag { display: block; }

    /* ── Stage ──────────────────────────────────────────────────────── */

    .stage { display: flex; flex-grow: 1; min-width: 0; min-height: 0; }

    .col-main {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-width: 0;
      padding: 34px 64px 34px 80px;
      overflow-y: auto;
    }

    .col-main.is-centered { justify-content: center; }

    .label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: var(--faint);
    }

    .instruction {
      margin: 12px 0 0;
      max-width: 640px;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    .passage {
      font-weight: var(--passage-weight);
      margin: 26px 0 0;
      max-width: 640px;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 2.05;
      color: var(--ink);
      text-wrap: pretty;
    }

    /* Read Aloud and Listening carry no answer rail, so the text takes the
       whole stage instead of hugging a 640px column with dead space beside it.
       The type goes up with the line length to keep it readable at that width. */
    .col-main.is-wide { padding: 34px 72px; }
    .col-main.is-wide .instruction,
    .col-main.is-wide .passage,
    .col-main.is-wide .player,
    .col-main.is-wide .speak-panel { max-width: none; }
    .col-main.is-wide .passage { font-size: 23px; line-height: 1.95; }
    .col-main.is-wide .passage.is-listening { font-size: 21px; line-height: 2.25; }

    .fill-status {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      font-size: 13.5px;
      color: var(--muted);
    }

    .fill-status .rail-hint { margin-left: auto; }

    /* ── Listening blanks are typed straight into the passage ───────── */

    .slot-wrap { position: relative; display: inline-flex; vertical-align: baseline; }

    .slot-wrap::before {
      content: attr(data-n);
      position: absolute;
      top: -10px;
      left: 0;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--faint);
    }

    .slot-input {
      width: 13ch;
      padding: 0 6px;
      border: none;
      border-bottom: var(--bw2) solid var(--ink);
      border-radius: 0;
      background: var(--surface);
      font-family: var(--sans);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink);
      text-align: center;
    }

    .slot-input::placeholder { color: transparent; }
    .slot-input:placeholder-shown { border-bottom-color: var(--ghost); background: var(--surface); }
    .slot-input:hover { background: var(--line-2); }

    .slot-input:focus {
      outline: none;
      border-bottom: 2px solid var(--ink);
      background: var(--line-2);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.16);
    }

    /* ── F · fixed-width slots, so answering never reflows the text ─── */

    .slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border: none;
      border-bottom: var(--bw2) solid var(--ghost);
      background: var(--surface);
      font-family: var(--sans);
      font-size: 16.5px;
      line-height: 1.5;
      color: var(--ghost);
      vertical-align: baseline;
    }

    .slot::before {
      content: attr(data-n);
      position: absolute;
      top: -9px;
      left: 0;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--faint);
    }

    .slot:hover { background: var(--line-2); }

    .slot.is-filled {
      border-bottom-color: var(--ink);
      font-weight: 500;
      color: var(--ink);
    }

    .slot.is-active {
      border-bottom: 2px solid var(--ink);
      background: var(--line-2);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.16);
    }

    /* ── F · answer rail ────────────────────────────────────────────── */

    .rail {
      display: flex;
      flex-direction: column;
      width: var(--rail-w);
      flex-shrink: 0;
      padding: 30px 34px 24px;
      border-left: var(--bw) solid var(--line);
      background: var(--surface-2);
      overflow-y: auto;
    }

    .rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: var(--bw) solid var(--line);
    }

    .rail-count { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink); }

    .rail-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line-2);
    }

    .rail-row.is-active {
      margin-left: -14px;
      padding-left: 12px;
      border-left: 2px solid var(--ink);
    }

    .rail-snippet { display: flex; align-items: baseline; gap: 10px; }

    .rail-n { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--faint); flex-shrink: 0; }

    .rail-text { font-family: var(--serif); font-size: 13.5px; line-height: 1.5; color: var(--muted); }

    .rail-body { padding-left: 21px; }

    .rail-chosen { display: flex; align-items: center; justify-content: space-between; }

    .rail-word { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; color: var(--ink); }

    .rail-change {
      border: none;
      background: none;
      padding: 0;
      font-size: 13px;
      color: var(--muted);
      text-decoration: underline;
    }

    .rail-empty { display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: var(--faint); }

    .opt-list { display: flex; flex-direction: column; gap: 6px; }

    .opt {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: var(--bw) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      text-align: left;
    }

    .opt:hover { border-color: var(--ghost); background: var(--surface-2); }

    .opt.is-picked { border-color: var(--ink); background: var(--line-2); }

    .opt-key {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: var(--radius);
      background: var(--line-2);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--faint);
    }

    .opt.is-picked .opt-key { background: var(--ink); color: #fff; }

    .opt-word { font-size: 15px; color: var(--ink); }

    .fill-input {
      display: block;
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: var(--bw) solid var(--ghost);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
    }

    .fill-input:focus {
      outline: none;
      border: var(--bw2) solid var(--ink);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.16);
    }

    .fill-input::placeholder { font-weight: 400; color: var(--ghost); }

    .rail-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: var(--bw) solid var(--line);
    }

    .rail-hint { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--faint); }
    .rail-left { margin-left: auto; font-size: 12.5px; color: var(--faint); }

    /* ── Audio player ───────────────────────────────────────────────── */

    .player {
      display: flex;
      align-items: center;
      gap: 18px;
      max-width: 640px;
      padding: 14px 18px;
      border: var(--bw) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .player-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
    }

    .wave { display: flex; align-items: center; gap: 2px; flex-grow: 1; min-width: 0; overflow: hidden; height: 34px; }
    .wave span { display: block; width: 2px; border-radius: 999px; background: var(--ghost); flex-shrink: 0; }
    .wave span.is-played { background: var(--ink); }

    .player-meta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .player-time { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 9px;
      border: var(--bw) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-2);
    }

    .plays { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--faint); white-space: nowrap; }

    /* ── Speaking ───────────────────────────────────────────────────── */

    .speak-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 640px;
      margin-top: 30px;
      padding: 28px 32px;
      border: var(--bw) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .rec-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border: none;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
    }

    .rec-btn:hover { background: #b91c1c; }
    .rec-btn.is-recording { background: var(--ink); }

    .meter { display: flex; align-items: center; justify-content: center; gap: 3px; height: 48px; }
    .meter span { display: block; width: 3px; border-radius: 999px; background: var(--line); }
    .meter span.is-lit { background: var(--accent); }

    .timer { font-family: var(--mono); font-size: 32px; letter-spacing: -0.01em; color: var(--ink); }

    .speak-hint { margin-top: 14px; font-size: 15px; font-weight: 500; color: var(--ink); }
    .speak-sub { margin-top: 6px; font-size: 13.5px; color: var(--muted); text-align: center; }

    /* ── Buttons ────────────────────────────────────────────────────── */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 46px;
      padding: 0 24px;
      border: var(--bw) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 14.5px;
      color: var(--ink-2);
    }

    .btn:hover { border-color: var(--ghost); background: var(--surface-2); }
    .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

    .btn-dark { border-color: var(--ink); background: var(--ink); color: var(--surface); font-weight: 500; box-shadow: var(--hard); }
    .btn-dark:hover { background: #000; border-color: #000; }

    .btn-flag { height: 30px; padding: 0 13px; font-size: 12.5px; }
    .btn-flag.is-on { border-color: var(--ink); background: var(--line-2); color: var(--ink); font-weight: 500; }

    /* ── Footer ─────────────────────────────────────────────────────── */

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      height: var(--foot-h);
      flex-shrink: 0;
      padding: 0 40px;
      border-top: var(--bw) solid var(--line);
      background: var(--surface);
    }

    .foot-note { font-size: 13.5px; color: var(--muted); text-align: center; }

    /* ── Intro / mic check / review / done ──────────────────────────── */

    .sheet {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 48px 40px;
      align-items: center;
    }

    .sheet-inner { width: 100%; max-width: 980px; }

    .h1 { margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; }
    .lead { margin: 12px 0 0; font-size: 15.5px; line-height: 1.62; color: var(--ink-2); }

    .toc { margin-top: 30px; border-top: var(--bw) solid var(--line); }

    .toc-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line-2);
    }

    .toc-left { display: flex; align-items: baseline; gap: 18px; }
    .toc-n { font-family: var(--mono); font-size: 12px; color: var(--faint); }
    .toc-title { font-size: 16px; font-weight: 500; }
    .toc-sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
    .toc-count { font-family: var(--mono); font-size: 14px; color: var(--ink-2); }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
      gap: 10px;
      margin-top: 26px;
    }

    .review-cell {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 96px;
      padding: 13px 14px;
      border: var(--bw) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      text-align: left;
    }

    .review-cell:hover { border-color: var(--ghost); }
    .review-cell.is-partial { border-color: var(--warn-line); background: var(--warn-bg); }
    .review-cell.is-empty { border-color: var(--danger-line); background: var(--danger-bg); }

    .review-n { font-family: var(--mono); font-size: 17px; font-weight: 500; }
    .review-sec { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--faint); }
    .review-state { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
    .review-cell.is-partial .review-state { color: #a16207; }
    .review-cell.is-empty .review-state { color: #b91c1c; }

    .stats { display: flex; align-items: center; gap: 22px; }
    .stat { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .stat-n { font-family: var(--mono); font-size: 22px; font-weight: 500; }
    .stat-l { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--faint); }

    .callout {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 26px;
      padding: 16px 18px;
      border: 1px solid var(--warn-line);
      border-radius: var(--radius);
      background: var(--warn-bg);
      font-size: 14.5px;
      color: #78350f;
    }

    .timeline { margin-top: 34px; }

    .tl-row { display: flex; gap: 16px; }
    .tl-rail { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }

    .tl-n {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: var(--bw) solid var(--line);
      border-radius: 50%;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .tl-line { width: 1px; flex-grow: 1; margin: 6px 0; background: var(--line); }
    .tl-body { padding-bottom: 22px; }
    .tl-title { font-size: 15.5px; font-weight: 500; }
    .tl-sub { margin-top: 5px; font-size: 14px; line-height: 1.6; color: var(--muted); }

    /* ── Test panel (prototype only) ────────────────────────────────── */

    .test-toggle {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 90;
      height: 26px;
      padding: 0 10px;
      border: var(--bw) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      opacity: 0.6;
    }

    .test-toggle:hover { opacity: 1; }

    .test-panel {
      position: fixed;
      left: 12px;
      bottom: 46px;
      z-index: 90;
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 250px;
      padding: 14px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 14px 40px -10px rgba(9, 9, 11, 0.3);
    }

    .test-panel.is-open { display: flex; }

    .test-panel h3 {
      margin: 0 0 4px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--faint);
    }

    .test-panel button {
      height: 32px;
      padding: 0 10px;
      border: var(--bw) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 13px;
      color: var(--ink-2);
      text-align: left;
    }

    .test-panel button:hover { background: var(--line-2); }

    .test-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--ink-2);
    }

    /* ── Per-skin structure ──────────────────────────────────────────
       Colour alone would not separate these three; the pieces below are the
       structural moves that actually distinguish the directions. */

    /* Editorial sets labels wider and drops the filled navigator glyph for a
       rule, so the sheet reads as paper rather than as an application. */
    [data-skin="a"] .label,
    [data-skin="a"] .nav-head,
    [data-skin="a"] .rail-hint,
    [data-skin="a"] .bar-section,
    [data-skin="a"] .bar-counter,
    [data-skin="a"] .saved-text { letter-spacing: var(--label-ls); }

    [data-skin="a"] .nav,
    [data-skin="a"] .rail { background: var(--surface); }
    [data-skin="a"] .nav-row.is-current { background: var(--line-2); }
    [data-skin="a"] .tick.is-current { background: var(--accent); }
    [data-skin="a"] .btn-dark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    [data-skin="a"] .passage { letter-spacing: 0.002em; }

    /* Signal keeps hard edges: square corners, 2px rules, offset shadows and
       a filled section band instead of a hairline. */
    [data-skin="c"] .rail,
    [data-skin="c"] .nav { background: var(--surface-2); }
    [data-skin="c"] .opt.is-picked { background: var(--accent); border-color: var(--ink); }
    [data-skin="c"] .opt.is-picked .opt-word { color: var(--on-accent); font-weight: 600; }
    [data-skin="c"] .opt.is-picked .opt-key { background: var(--ink); color: var(--on-accent); }
    [data-skin="c"] .slot.is-filled { background: var(--accent); color: var(--on-accent); font-weight: 600; }
    [data-skin="c"] .btn-dark { box-shadow: var(--hard); }
    [data-skin="c"] .review-cell,
    [data-skin="c"] .player,
    [data-skin="c"] .speak-panel { box-shadow: none; }
    [data-skin="c"] .rec-btn { border-radius: 0; }

    /* ── Responsive fallback ────────────────────────────────────────── */

    /* The reading measure is the point of the split view, so the chrome gives
       ground before the passage column does. At 1280 the untightened nav+rail
       left it at ~45 characters; these keep it near 60. */
    @media (max-width: 1460px) {
      :root { --nav-w: 228px; --rail-w: 344px; }
      .col-main { padding: 30px 40px 30px 52px; }
    }

    @media (max-width: 1180px) {
      :root { --nav-w: 208px; --rail-w: 320px; }
      .col-main { padding: 26px 28px 26px 36px; }
      .rail { padding: 26px 24px 20px; }
    }

    @media (max-width: 1000px) {
      .stage { flex-direction: column; overflow-y: auto; }
      .col-main { overflow: visible; padding: 24px 28px; }
      .rail { width: auto; border-left: none; border-top: var(--bw) solid var(--line); overflow: visible; }
      .passage, .instruction, .player { max-width: none; }
    }

    @media (max-width: 860px) {
      .bar { gap: 20px; }
      .bar-brand { width: auto; padding-left: 20px; }
      .bar-right { padding-right: 20px; }
      .ticks, .bar-counter, .saved-text { display: none; }
      .nav { position: fixed; inset: var(--bar-h) auto 0 0; z-index: 80; transform: translateX(-100%); transition: transform 0.2s ease; box-shadow: 0 0 40px rgba(9, 9, 11, 0.2); }
      .nav.is-open { transform: none; }
      .nav-toggle { display: inline-flex !important; }
      .foot { padding: 0 20px; }
      .foot-note { display: none; }
    }

    .nav-toggle { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>

<body>
  <div class="app" id="app"></div>

  <button class="test-toggle" id="test-toggle" type="button">⚙ TEST</button>
  <div class="test-panel" id="test-panel">
    <h3>PROTOTYPE SHORTCUTS</h3>
    <button type="button" data-test="fill-all">Điền hết đáp án</button>
    <button type="button" data-test="fill-most">Điền hết, chừa 2 lỗi</button>
    <button type="button" data-test="review">Nhảy tới màn xem lại</button>
    <button type="button" data-test="done">Nhảy tới màn đã nộp</button>
    <button type="button" data-test="reset">Xoá hết &amp; làm lại</button>
    <label><input type="checkbox" id="test-miccheck" checked> Bật bước kiểm tra micro</label>
  </div>

  <script>
    (function () {
      'use strict';

      // ═══════════════════════════════════════════════════════════════
      // Content — copied verbatim from
      // functions/src/entrance-test/test36plus.js
      // ═══════════════════════════════════════════════════════════════

      const SECTIONS = [
        {
          id: 'speaking',
          numeral: 'I',
          nav: 'I · ĐỌC & NÓI',
          title: 'Đọc & Nói',
          kind: 'speaking',
          instruction: 'Hãy đọc đoạn văn dưới đây thành tiếng, lưu ý đọc rõ ràng và trôi chảy nhất có thể. Bạn có thể tập đọc trước cho quen rồi hãy bắt đầu thu âm nhé.',
          blurb: 'Đọc to đoạn văn, thu âm',
          questions: [
            { id: 'speaking_q1', nav: 'Đọc đoạn 1', text: `Scientists make observations, make assumptions, and do experiments. After these have been done, they get their results. Then there is a lot of data from scientists. The scientists around the world have a picture of the world.` },
            { id: 'speaking_q2', nav: 'Đọc đoạn 2', text: `Statistics are indicators of change and allow meaningful comparisons to be made. While it may be the issues rather than the statistics that grab people's attention, it should be recognised that it is the statistics that inform the issues. Statistical literacy, then, is the ability to accurately understand, interpret and evaluate the data that inform these issues.` },
            { id: 'speaking_q3', nav: 'Đọc đoạn 3', text: `The numbers on US student debt, after all, are truly staggering. The average 2015 US university graduate who took out loans to help pay for tuition enters the workforce with $35,000 in student debt. In the US, total student debt exceeds $1.15 trillion - dwarfing, for instance, the nation's credit card debt.` }
          ]
        },
        {
          id: 'vocab',
          numeral: 'II',
          nav: 'II · TỪ VỰNG',
          title: 'Từ vựng',
          kind: 'mc',
          instruction: 'Hãy đọc thật kỹ đoạn văn rồi dựa vào ý nghĩa của câu và của các lựa chọn để chọn từ thích hợp nhất cho ô trống.',
          blurb: 'Chọn từ theo ngữ cảnh',
          questions: [
            { id: 'vocab_q1', nav: 'Đoạn 1', raw: `Most groups of animals have their specialist feeders adapted to a very limited type of food. Among __reptiles/insects/mammals/primates__, perhaps the most extraordinary is an African egg-eating snake. Many snakes eat eggs as part of a varied __diet/habit/tradition/plan__ but the egg eater eats exclusively eggs. Small, soft-shelled eggs are __easy/hard/slow/difficult__ to eat, as they can be quickly opened by the snake's teeth. Larger, hard-shelled eggs such as those laid by birds need special treatment. However, some types of egg-eating snakes eat only birds' eggs which they swallow whole as they have few teeth. They have tooth-like spines that stick down from the backbone and crack open the egg as it passes down the snake's __throat/eyes/lungs/nose__.` },
            { id: 'vocab_q2', nav: 'Đoạn 2', raw: `Used in a variety of courses in various disciplines, Asking The Right Questions helps students __bridge/widen/spoil/leak__ the gap between simply memorizing or blindly accepting information, and the greater challenge of critical analysis and synthesis. Specifically, this concise text teaches students to think __critically/importantly/crucially/essentially__ by exploring the components of arguments - issues, conclusions, reasons, evidence, assumptions, language - and on how to spot fallacies, manipulations, and obstacles to critical thinking in both written and visual communication. It teaches them to respond to alternative points of view and develop a solid foundation for making personal choices about what to accept and what to __reject/reflect/remake/respond__.` },
            { id: 'vocab_q3', nav: 'Đoạn 3', raw: `A creature may have fine __physical/mental/chemical/spiritual__ defenses such as hard armor or sharp spines. It may have powerful chemical defenses such as an __appalling/appealing/attractive/appetizing__ smell or foul-tasting flesh. But none of these defenses is much used in a struggle for survival unless the animal also has the right behavior to go with it. Evolution shapes a living creature's size, colour, and other features. It also shapes an animal's actions and behavior patterns. The most important behaviors are __instinctive/acquired/extrinsic/intuitive__ and inbuilt. In other words, the creature can perform the action without having to learn what to do and how to do it by __trial/effort/attempt/encouragement__ and error.` },
            { id: 'vocab_q4', nav: 'Đoạn 4', raw: `DNA is a molecule that does two things. First, it acts as the __hereditary/building/metabolic/nutritional__ material, which is passed __down/out/around/by__ from generation to generation. Second, it directs, to a considerable extent, the construction of our bodies, telling our cells what kinds of molecules to make and guiding our development from a single-celled zygote to a fully formed adult. These two things are, of course, connected. The DNA sequences that construct the best bodies are more likely to get passed down to the next generation because well-constructed bodies are more likely to __survive/exist/wither/multiply__ and thus to reproduce. This is Darwin's __theory/hypothesis/statement/thesis__ of natural selection stated in the language of DNA.` }
          ]
        },
        {
          id: 'grammar',
          numeral: 'III',
          nav: 'III · NGỮ PHÁP',
          title: 'Ngữ pháp',
          kind: 'mc',
          instruction: 'Hãy đọc thật kỹ đoạn văn rồi dựa vào ý nghĩa và cấu trúc ngữ pháp của câu và của các lựa chọn để chọn từ thích hợp nhất cho ô trống.',
          blurb: 'Chọn từ theo cấu trúc câu',
          questions: [
            { id: 'grammar_q1', nav: 'Đoạn 1', raw: `Philosophy for Children is __designed/design/designing/designs__ to help children become more willing and able to question, reason, construct arguments, and collaborate. Dialogues are based on concepts such as 'truth', 'fairness', or 'bullying'. In a typical lesson, pupils and teachers sit together in a circle and the teacher begins by presenting a stimulus, __which/what/who/why__ could be a video clip, image or newspaper article to provoke pupils' interest. This is generally followed by some silent thinking time before the class splits into groups to think of questions that __interest/interests/interesting/interestingly__ them. A certain question with philosophical potential is then selected by the group to stimulate a whole-class discussion. These discussions are supported by activities __to/for/by/in__ develop children's skills __in/on/around/to__ reasoning and their understanding of concepts.` },
            { id: 'grammar_q2', nav: 'Đoạn 2', raw: `Traditionally, the analysis of music is a solitary activity, completed by individual theorists, performers, or conductors before their interpretations are disseminated through writing, presentation, or performance. A similar model is often used for teaching analysis: students are given the context in which a piece was composed, taught the most appropriate analytical approaches, and then asked to complete their analysis on their own, usually outside of class time as a homework assignment. __However/Therefore/Moreover/Additionally__, recent research into cognitive science has found that students learn better in a group than __individually/individuals/individualized/individual__, coining the concept "collective general intelligence" to describe a group's ability to perform better on complex tasks such as solving puzzles, making moral judgments, and brainstorming. In education fields, this concept has been applied to "peer learning" in __which/what/who/where__ students learn from other students by participating in communal activities, discussions, and tasks and this has also been shown to result in more effective learning than the traditional solitary method of learning. These more active and collaborative forms of learning are able to better provide conceptual understanding and long-term knowledge retention __because/and/so/however__ students are placed at the center of their own learning.` },
            { id: 'grammar_q3', nav: 'Đoạn 3', raw: `Colorful poison frogs in the Amazon owe their great diversity to ancestors that leapt into the region from the Andes Mountains several times during the last 10 million years, a new study from The University of Texas at Austin suggests. This is the first study to show that the Andes __have been/has been/had been/will be__ a major source of diversity for the Amazon basin, one of the largest reservoirs of __biological/biology/biologically/biologist__ diversity on Earth. The finding runs counter thoroughly to the idea that Amazonian diversity is the result of evolution only within the tropical forest itself.` },
            { id: 'grammar_q4', nav: 'Đoạn 4', raw: `Dogs make great listeners. And that may be because man and man's best friend use analogous brain regions to process voices. Researchers collected almost 200 sound samples, including human and canine vocalizations, as well as environmental noises and silence. They __played/play/will play/have played__ these clips to 22 people and 11 dogs while the subjects' brains __were undergoing/underwent/will undergo/undergo__ functional MRI scans. Human brains tuned in most to vocal sounds. Dog brains were most sensitive to environmental noises. __Nevertheless/In conclusion/Similarly/Consquently__, they still had a lot in common. A dedicated brain area reacted strongly to the vocalizations of their own species. That area also responded to the voices of the other species. Meanwhile, a different brain region noted emotion in a voice, with a strong response to cheery sounds like laughter and a weaker reaction to unhappy noises like canine whining. The study is in the journal Current Biology. It seems that thousands of years of domestication __have made/will make/made/has made__ our furry friends sensitive to the same vocal cues we are. You can confide in Fido.` }
          ]
        },
        {
          id: 'listen_write',
          numeral: 'IV',
          nav: 'IV · NGHE & VIẾT',
          title: 'Nghe & Viết',
          kind: 'fill',
          instruction: 'Hãy điền từ phù hợp vào các ô trống. Chú ý chính tả — không cần viết hoa. Bạn có thể nghe lại nhiều lần trước khi nộp.',
          blurb: 'Nghe ghi âm, điền từ',
          questions: [
            { id: 'listen_write_q1', nav: 'Bài nghe 1', audio: '/database/Entrance Test/Listening Q1.mp3', raw: `So every year influenza does strike. It __causes__ seasonal flu outbreaks and that's caused by new influenza strains. It affects about 5 to 20% of US residents, and 200,000 people become __sick__ each year and 36,000 people die from flu. And sometimes, flu viruses can actually __mutate__ to form novel viruses. We worry about novel influenza subtypes because they can cause pandemics and a pandemic is a __global__ __outbreak__ of a disease. The most severe influenza pandemic in the last century occurred in 1918. And it was caused by a flu virus called H1N1. It began in the United States around September 14, and within five weeks, it'd __spread__ __throughout__ the entire United States. It's estimated that 20 to 100 million people died worldwide from this disease that year and it included 500,000 Americans.` },
            { id: 'listen_write_q2', nav: 'Bài nghe 2', audio: '/database/Entrance Test/Listening Q2.mp3', raw: `The term that's __increasingly__ __used__ now is post-antibiotic era. And I guess the question is, what does that mean? To put it in __context__, in the 1920s and 30s, we didn't have antibiotics so if people got seriously __ill__ they either survived because of their own immunity or they died. And we call that the pre-antibiotic era. What has actually happened is that we got a lot of antibiotics, particularly in the 50s but 60s, 70s, 80s. So much so that a US Secretary of Health or Surgeon General said that the era of __infections__ was over because we have all these drugs to cure all these things. Well, what has actually happened is we've gone into a post-antibiotic era with some __bacteria__. For a lot of people with very __common__ infections, we're back in the 1920s because we don't have effective antibiotics that __worked__.` }
          ]
        }
      ];

      // ═══════════════════════════════════════════════════════════════
      // Parsing — same __a/b/c__ grammar the server uses. More than one
      // option means multiple choice; a single token is a fill blank.
      // ═══════════════════════════════════════════════════════════════

      function parseRaw(raw) {
        const parts = [];
        let cursor = 0;
        let n = 0;

        while (cursor < raw.length) {
          const start = raw.indexOf('__', cursor);
          if (start === -1) break;
          const end = raw.indexOf('__', start + 2);
          if (end === -1) break;

          const before = raw.slice(cursor, start);
          if (before) parts.push({ type: 'text', text: before });

          const options = raw.slice(start + 2, end).split('/').map(s => s.trim()).filter(Boolean);
          n += 1;
          parts.push(options.length > 1
            ? { type: 'blank', kind: 'mc', n, options, answer: options[0] }
            : { type: 'blank', kind: 'fill', n, answer: options[0] || '' });

          cursor = end + 2;
        }

        const after = raw.slice(cursor);
        if (after) parts.push({ type: 'text', text: after });
        return parts;
      }

      function seeded(seed) {
        let h = 2166136261;
        for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
        return function () { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
      }

      function shuffle(list, seed) {
        const rand = seeded(seed);
        const out = list.slice();
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          const t = out[i]; out[i] = out[j]; out[j] = t;
        }
        return out;
      }

      // Flatten the question list, resolving parts and shuffled options once.
      const QUESTIONS = [];
      SECTIONS.forEach((section, si) => {
        section.questions.forEach((q, qi) => {
          const parts = q.raw ? parseRaw(q.raw) : [];
          const blanks = parts.filter(p => p.type === 'blank');
          blanks.forEach((b) => {
            if (b.kind === 'mc') b.shown = shuffle(b.options, q.id + ':' + b.n);
          });
          QUESTIONS.push({
            id: q.id,
            nav: q.nav,
            sectionId: section.id,
            sectionIndex: si,
            sectionNumeral: section.numeral,
            sectionNav: section.nav,
            sectionTitle: section.title,
            instruction: section.instruction,
            kind: section.kind,
            indexInSection: qi + 1,
            countInSection: section.questions.length,
            text: q.text || '',
            audio: q.audio || '',
            parts,
            blanks
          });
        });
      });

      const TOTAL = QUESTIONS.length;

      // The phrase around a blank, for the rail row.
      function snippetFor(question, blankN) {
        let flat = '';
        let at = -1;
        question.parts.forEach((p) => {
          if (p.type === 'text') { flat += p.text; return; }
          if (p.n === blankN) at = flat.length;
          flat += ' ___ ';
        });
        if (at === -1) return '';
        const before = flat.slice(Math.max(0, at - 34), at).replace(/^\S*\s/, '');
        const after = flat.slice(at + 5, at + 5 + 30).replace(/\s\S*$/, '');
        return (at > 34 ? '… ' : '') + before.trim() + ' ___ ' + after.trim() + ' …';
      }

      // ═══════════════════════════════════════════════════════════════
      // State
      // ═══════════════════════════════════════════════════════════════

      const STORAGE_KEY = 'entrance_test_ui_lab_v1:' + (window.__ET_SKIN__ || 'b');

      const state = {
        view: 'intro',       // intro | miccheck | question | review | done
        q: 0,
        answers: {},         // questionId -> array of strings, one per blank
        flags: {},           // questionId -> true
        active: {},          // questionId -> 1-based blank being worked on
        speaking: {},        // questionId -> { url, seconds }  (in memory only)
        savedAt: null,
        micChecked: false,
        micCheckEnabled: true,
        plays: {}            // questionId -> replay count
      };

      function blankCount(q) { return q.blanks.length; }

      function answersFor(q) {
        if (!state.answers[q.id]) state.answers[q.id] = new Array(blankCount(q)).fill('');
        return state.answers[q.id];
      }

      function filledCount(q) {
        if (q.kind === 'speaking') return state.speaking[q.id] ? 1 : 0;
        return answersFor(q).filter(a => a && a.trim()).length;
      }

      function totalSlots(q) { return q.kind === 'speaking' ? 1 : blankCount(q); }

      function statusOf(q) {
        const done = filledCount(q);
        if (done === 0) return 'empty';
        if (done < totalSlots(q)) return 'partial';
        return 'answered';
      }

      function save() {
        state.savedAt = new Date();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            q: state.q,
            answers: state.answers,
            flags: state.flags,
            active: state.active,
            micChecked: state.micChecked,
            plays: state.plays
          }));
        } catch (e) { /* private mode — the prototype still works, just forgets */ }
      }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const d = JSON.parse(raw);
          if (d && typeof d === 'object') {
            state.q = Number.isFinite(d.q) ? d.q : 0;
            state.answers = d.answers || {};
            state.flags = d.flags || {};
            state.active = d.active || {};
            state.micChecked = !!d.micChecked;
            state.plays = d.plays || {};
          }
        } catch (e) { /* ignore */ }
      }

      // ═══════════════════════════════════════════════════════════════
      // Small helpers
      // ═══════════════════════════════════════════════════════════════

      const app = document.getElementById('app');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function pad2(n) { return String(n).padStart(2, '0'); }

      function clock(d) { return d ? pad2(d.getHours()) + ':' + pad2(d.getMinutes()) : '--:--'; }

      function mmss(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        return Math.floor(s / 60) + ':' + pad2(s % 60);
      }

      const ICON = {
        flag: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.5-6 4.5Z"></path></svg>',
        flagOn: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.5-6 4.5Z"></path></svg>',
        check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>',
        warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6"></path><path d="M12 16.5h.01"></path></svg>',
        cross: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10"></path><path d="M17 7 7 17"></path></svg>',
        play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M8 5.5a1 1 0 0 1 1.5-.86l9 6.5a1 1 0 0 1 0 1.72l-9 6.5A1 1 0 0 1 8 18.5Z"></path></svg>',
        pause: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.4"></rect><rect x="13.5" y="5" width="4" height="14" rx="1.4"></rect></svg>',
        mic: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>',
        stop: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"></rect></svg>',
        redo: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5A8.5 8.5 0 1 1 17.8 6"></path><path d="M20 4v4.5h-4.5"></path></svg>',
        menu: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>'
      };

      // Deterministic bar heights, so a given clip always draws the same wave.
      function waveBars(seed, count, height) {
        const rand = seeded(seed);
        const out = [];
        for (let i = 0; i < count; i++) {
          const env = Math.sin((i / count) * Math.PI) * 0.72 + 0.28;
          out.push(Math.max(3, Math.round((0.3 + rand() * 0.7) * env * height)));
        }
        return out;
      }

      // ═══════════════════════════════════════════════════════════════
      // Chrome
      // ═══════════════════════════════════════════════════════════════

      function renderBar() {
        const q = QUESTIONS[state.q];
        const answered = QUESTIONS.filter(x => statusOf(x) === 'answered').length;

        let n = 0;
        const groups = SECTIONS.map((s) => {
          const bars = s.questions.map(() => {
            n += 1;
            const isCurrent = state.view === 'question' && n === state.q + 1;
            const isDone = statusOf(QUESTIONS[n - 1]) === 'answered';
            return '<span class="tick' + (isCurrent ? ' is-current' : (isDone ? ' is-done' : '')) + '"></span>';
          }).join('');
          return '<div class="tick-group">' + bars + '</div>';
        }).join('');

        let sectionLabel = 'BÀI KIỂM TRA ĐẦU VÀO';
        if (state.view === 'question') sectionLabel = pad2(q.sectionIndex + 1) + ' · ' + q.sectionNav.split('· ')[1];
        if (state.view === 'review') sectionLabel = 'XEM LẠI TRƯỚC KHI NỘP';
        if (state.view === 'done') sectionLabel = 'ĐÃ NỘP BÀI';
        if (state.view === 'miccheck') sectionLabel = '01 · CHUẨN BỊ';

        const counter = state.view === 'question'
          ? pad2(state.q + 1) + ' / ' + TOTAL
          : answered + ' / ' + TOTAL;

        const showSubmit = state.view === 'question';

        return '' +
          '<div class="bar">' +
            '<div class="bar-brand">' +
              '<button class="btn nav-toggle" id="nav-toggle" type="button" style="height:28px;padding:0 8px;background:transparent;border-color:var(--chrome-line);color:var(--chrome-fg)">' + ICON.menu + '</button>' +
              '<img src="/database/Logo.png" alt="">' +
              '<span>ENTRANCE TEST</span>' +
            '</div>' +
            '<div class="bar-mid">' +
              '<span class="bar-section">' + esc(sectionLabel) + '</span>' +
              '<div class="ticks">' + groups + '</div>' +
              '<span class="bar-counter">' + esc(counter) + '</span>' +
            '</div>' +
            '<div class="bar-right">' +
              '<div class="saved"><span class="saved-dot"></span><span class="saved-text">ĐÃ LƯU ' + clock(state.savedAt) + '</span></div>' +
              (showSubmit ? '<span class="bar-sep"></span><button class="btn-submit-top" type="button" data-go="review">Nộp bài</button>' : '') +
            '</div>' +
          '</div>';
      }

      function renderNav() {
        const rows = SECTIONS.map((s) => {
          const head = '<div class="nav-head">' + esc(s.nav) + '</div>';
          const items = s.questions.map((sq) => {
            const idx = QUESTIONS.findIndex(x => x.id === sq.id);
            const q = QUESTIONS[idx];
            const st = statusOf(q);
            const cls = [
              'nav-row',
              idx === state.q && state.view === 'question' ? 'is-current' : '',
              st === 'answered' ? 'is-answered' : (st === 'partial' ? 'is-partial' : ''),
              state.flags[q.id] ? 'is-flagged' : ''
            ].filter(Boolean).join(' ');
            return '<button class="' + cls + '" type="button" data-goq="' + idx + '">' +
              '<span class="nav-num">' + pad2(idx + 1) + '</span>' +
              '<span class="nav-glyph"></span>' +
              '<span class="nav-label">' + esc(q.nav) + '</span>' +
              '<span class="nav-flag">' + ICON.flagOn + '</span>' +
            '</button>';
          }).join('');
          return head + items;
        }).join('');

        return '<aside class="nav" id="nav">' + rows + '</aside>';
      }

      // ═══════════════════════════════════════════════════════════════
      // F · passage with fixed-width slots + answer rail
      // ═══════════════════════════════════════════════════════════════

      function slotWidthCh(blank) {
        if (blank.kind === 'fill') return 12;
        const longest = blank.options.reduce((m, o) => Math.max(m, o.length), 0);
        return Math.max(7, longest + 2);
      }

      function renderPassage(q) {
        const ans = answersFor(q);
        const active = state.active[q.id] || 1;

        const html = q.parts.map((p) => {
          if (p.type === 'text') return esc(p.text);
          const value = ans[p.n - 1] || '';

          // Listening blanks are typed in place. Every slot is the same width,
          // so it neither reflows the text nor leaks how long the answer is.
          if (p.kind === 'fill') {
            return '<span class="slot-wrap" data-n="' + pad2(p.n) + '">' +
              '<input class="slot-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"' +
              ' placeholder=" " data-fill="' + p.n + '" aria-label="Ô trống ' + p.n + '" value="' + esc(value) + '">' +
            '</span>';
          }

          const cls = ['slot', value ? 'is-filled' : '', p.n === active ? 'is-active' : ''].filter(Boolean).join(' ');
          return '<button class="' + cls + '" type="button" data-slot="' + p.n + '" data-n="' + pad2(p.n) + '"' +
            ' style="width:' + slotWidthCh(p) + 'ch">' + esc(value || ' ') + '</button>';
        }).join('');

        return '<p class="passage' + (q.kind === 'fill' ? ' is-listening' : '') + '">' + html + '</p>';
      }

      function renderRail(q) {
        const ans = answersFor(q);
        const active = state.active[q.id] || 1;
        const filled = filledCount(q);

        const rows = q.blanks.map((b) => {
          const value = ans[b.n - 1] || '';
          const isActive = b.n === active;
          const snippet = snippetFor(q, b.n);

          const head = '<div class="rail-snippet">' +
            '<span class="rail-n">' + pad2(b.n) + '</span>' +
            '<span class="rail-text">' + esc(snippet) + '</span>' +
          '</div>';

          let body;
          if (b.kind === 'fill') {
            body = '<div class="rail-body">' +
              '<input class="fill-input" type="text" autocomplete="off" spellcheck="false" placeholder="gõ từ bạn nghe được"' +
              ' data-fill="' + b.n + '" value="' + esc(value) + '">' +
            '</div>';
          } else if (isActive || !value) {
            const opts = b.shown.map((o, i) => {
              const picked = value === o;
              return '<button class="opt' + (picked ? ' is-picked' : '') + '" type="button" data-pick="' + b.n + '" data-word="' + esc(o) + '">' +
                '<span class="opt-key">' + 'ABCD'[i] + '</span>' +
                '<span class="opt-word">' + esc(o) + '</span>' +
              '</button>';
            }).join('');
            body = '<div class="rail-body"><div class="opt-list">' + opts + '</div></div>';
          } else {
            body = '<div class="rail-body"><div class="rail-chosen">' +
              '<span class="rail-word">' + ICON.check + esc(value) + '</span>' +
              '<button class="rail-change" type="button" data-slot="' + b.n + '">Đổi</button>' +
            '</div></div>';
          }

          return '<div class="rail-row' + (isActive ? ' is-active' : '') + '" data-row="' + b.n + '">' + head + body + '</div>';
        }).join('');

        const hint = q.kind === 'fill' ? 'TAB ĐỂ SANG Ô SAU' : 'A – D ĐỂ CHỌN';
        const left = totalSlots(q) - filled;

        return '<aside class="rail" id="rail">' +
          '<div class="rail-head">' +
            '<span class="label">' + (q.kind === 'fill' ? 'TỪ BẠN ĐIỀN' : 'ĐÁP ÁN CỦA BẠN') + '</span>' +
            '<span class="rail-count">' + filled + ' / ' + totalSlots(q) + '</span>' +
          '</div>' +
          rows +
          '<div class="rail-foot">' +
            '<span class="rail-hint">' + hint + '</span>' +
            '<span class="rail-left">' + (left > 0 ? 'Còn ' + left + ' ô' : 'Đã xong') + '</span>' +
          '</div>' +
        '</aside>';
      }

      function renderPlayer(q) {
        const bars = waveBars(q.id, 120, 34)
          .map((h, i) => '<span data-i="' + i + '" style="height:' + h + 'px"></span>').join('');
        const plays = state.plays[q.id] || 0;

        return '<div class="player" data-player="' + esc(q.id) + '">' +
          '<button class="player-btn" type="button" data-audio="toggle">' + ICON.play + '</button>' +
          '<div class="wave" data-audio="seek">' + bars + '</div>' +
          '<div class="player-meta">' +
            '<span class="player-time" data-audio="time">0:00 / --:--</span>' +
            '<button class="chip" type="button" data-audio="rate">1.0×</button>' +
            '<span class="plays" data-audio="plays">' + (plays ? 'NGHE ' + plays + ' LẦN' : 'CHƯA NGHE') + '</span>' +
          '</div>' +
          '<audio preload="metadata" src="' + esc(q.audio) + '"></audio>' +
        '</div>';
      }

      // ═══════════════════════════════════════════════════════════════
      // Speaking
      // ═══════════════════════════════════════════════════════════════

      const rec = { stream: null, recorder: null, chunks: [], startedAt: 0, raf: 0, ctx: null, analyser: null, timerEl: null, meterEl: null };

      function renderSpeaking(q) {
        const take = state.speaking[q.id];
        const isRecording = !!(rec.recorder && rec.recorder.state === 'recording' && rec.qid === q.id);

        let panel;
        if (isRecording) {
          panel = '<div class="speak-panel">' +
            '<div style="display:flex;align-items:center;gap:9px">' +
              '<span style="width:9px;height:9px;border-radius:50%;background:#dc2626"></span>' +
              '<span style="font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#b91c1c">Đang thu âm</span>' +
            '</div>' +
            '<div class="timer" id="rec-timer" style="margin-top:14px">00:00</div>' +
            '<div class="meter" id="rec-meter" style="margin-top:16px"></div>' +
            '<button class="btn btn-dark" type="button" data-rec="stop" style="margin-top:20px;background:#dc2626;border-color:#dc2626">' + ICON.stop + ' Dừng thu âm</button>' +
          '</div>';
        } else if (take) {
          panel = '<div class="speak-panel">' +
            (take.url
              ? '<audio controls src="' + esc(take.url) + '" style="width:100%;max-width:460px"></audio>'
              : '<div class="speak-hint" style="margin:0">Bản thu mô phỏng (từ bảng TEST)</div>') +
            '<div style="display:flex;align-items:center;gap:10px;margin-top:20px">' +
              '<button class="btn" type="button" data-rec="again">' + ICON.redo + ' Thu lại</button>' +
            '</div>' +
            '<div class="speak-sub" style="margin-top:14px">Bản thu dài ' + mmss(take.seconds) + '. Bạn có thể thu lại bao nhiêu lần tuỳ ý trước khi nộp bài.</div>' +
          '</div>';
        } else {
          panel = '<div class="speak-panel">' +
            '<button class="rec-btn" type="button" data-rec="start">' + ICON.mic + '</button>' +
            '<div class="speak-hint">Nhấn để bắt đầu thu âm</div>' +
            '<div class="speak-sub">Đọc thầm một lượt cho quen trước khi thu. Không giới hạn số lần thu lại.</div>' +
          '</div>';
        }

        return '<div class="stage"><div class="col-main is-wide">' +
          '<span class="label">HƯỚNG DẪN</span>' +
          '<p class="instruction">' + esc(q.instruction) + '</p>' +
          '<p class="passage">' + esc(q.text) + '</p>' +
          panel +
        '</div></div>';
      }

      // ═══════════════════════════════════════════════════════════════
      // Views
      // ═══════════════════════════════════════════════════════════════

      function renderQuestionView(q) {
        if (q.kind === 'speaking') return renderSpeaking(q);

        // Only multiple choice earns the rail. Listening is typed straight into
        // the passage, so it gets the full stage like Read Aloud does.
        const hasRail = q.kind === 'mc';
        const filled = filledCount(q);
        const left = totalSlots(q) - filled;

        const status = hasRail ? '' :
          '<div class="fill-status">' +
            '<span><strong style="color:var(--ink);font-weight:600">' + filled + ' / ' + totalSlots(q) + '</strong> ô đã điền</span>' +
            '<span>' + (left > 0 ? 'Còn ' + left + ' ô' : 'Đã xong') + '</span>' +
            '<span class="rail-hint">TAB ĐỂ SANG Ô SAU</span>' +
          '</div>';

        return '<div class="stage">' +
          '<div class="col-main' + (hasRail ? '' : ' is-wide') + '">' +
            '<div style="display:flex;align-items:center;gap:16px">' +
              '<span class="label">CÂU ' + pad2(state.q + 1) + ' · HƯỚNG DẪN</span>' +
              '<span style="flex-grow:1;height:1px;background:var(--line)"></span>' +
              '<button class="btn btn-flag' + (state.flags[q.id] ? ' is-on' : '') + '" type="button" data-flag="1">' +
                (state.flags[q.id] ? ICON.flagOn : ICON.flag) + (state.flags[q.id] ? 'Đã đánh dấu' : 'Đánh dấu xem lại') +
              '</button>' +
            '</div>' +
            '<p class="instruction">' + esc(q.instruction) + '</p>' +
            (q.audio ? '<div style="margin-top:24px">' + renderPlayer(q) + '</div>' : '') +
            status +
            renderPassage(q) +
          '</div>' +
          (hasRail ? renderRail(q) : '') +
        '</div>';
      }

      function renderFoot() {
        if (state.view !== 'question') return '';
        const isLast = state.q === TOTAL - 1;
        return '<div class="foot">' +
          '<button class="btn" type="button" data-goq="' + (state.q - 1) + '"' + (state.q === 0 ? ' disabled' : '') + '>← &nbsp;Câu ' + pad2(state.q) + '</button>' +
          '<span class="foot-note">Mọi thay đổi được lưu tự động. Bạn có thể quay lại sửa bất kỳ câu nào trước khi nộp.</span>' +
          (isLast
            ? '<button class="btn btn-dark" type="button" data-go="review">Xem lại &amp; nộp bài</button>'
            : '<button class="btn" type="button" data-goq="' + (state.q + 1) + '">Câu ' + pad2(state.q + 2) + '&nbsp; →</button>') +
        '</div>';
      }

      function renderIntro() {
        const toc = SECTIONS.map((s, i) => '<div class="toc-row">' +
          '<div class="toc-left">' +
            '<span class="toc-n">' + pad2(i + 1) + '</span>' +
            '<div><div class="toc-title">' + esc(s.title) + '</div><div class="toc-sub">' + esc(s.blurb) + '</div></div>' +
          '</div>' +
          '<span class="toc-count">' + s.questions.length + '</span>' +
        '</div>').join('');

        return '<div class="sheet"><div class="sheet-inner" style="max-width:720px">' +
          '<div style="display:flex;align-items:center;gap:14px">' +
            '<span style="display:block;width:26px;height:1px;background:var(--ink)"></span>' +
            '<span class="label" style="color:var(--ink)">SẴN SÀNG BẮT ĐẦU</span>' +
          '</div>' +
          '<h1 class="h1" style="margin-top:24px;font-size:44px">Bài kiểm tra đầu vào</h1>' +
          '<p class="lead" style="max-width:520px">Bốn phần, mười ba câu hỏi. Không có giới hạn thời gian, và bạn có thể quay lại sửa bất kỳ câu nào trước khi nộp.</p>' +
          '<div class="toc">' + toc + '</div>' +
          '<div style="display:flex;align-items:center;gap:18px;margin-top:34px">' +
            '<button class="btn btn-dark" type="button" data-go="start" style="height:52px;padding:0 32px;font-size:15px">Bắt đầu</button>' +
            '<span style="font-size:13.5px;color:var(--muted)">Tiến độ được lưu tự động trên máy này.</span>' +
          '</div>' +
        '</div></div>';
      }

      function renderMicCheck() {
        const bars = waveBars('mic', 72, 44).map(h => '<span style="height:' + h + 'px"></span>').join('');
        return '<div class="sheet" style="justify-content:center"><div class="sheet-inner" style="max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center">' +
          '<span class="label">BƯỚC CHUẨN BỊ</span>' +
          '<h1 class="h1" style="margin-top:16px">Kiểm tra micro</h1>' +
          '<p class="lead" style="max-width:440px">Hãy nói thử “một, hai, ba” để chắc chắn micro hoạt động. Bước này không được ghi lại và không tính điểm.</p>' +
          '<div class="meter" id="mic-meter" style="margin-top:34px">' + bars + '</div>' +
          '<div id="mic-status" style="margin-top:18px;font-size:14.5px;color:var(--muted)">Nhấn “Bật micro” để bắt đầu kiểm tra.</div>' +
          '<div style="display:flex;align-items:center;gap:12px;margin-top:32px">' +
            '<button class="btn btn-dark" type="button" data-mic="start">Bật micro</button>' +
            '<button class="btn" type="button" data-go="skipmic">Bỏ qua bước này</button>' +
          '</div>' +
          '<p style="margin-top:26px;max-width:460px;font-size:13px;line-height:1.6;color:var(--faint)">Nếu trình duyệt chưa hỏi quyền, nhấn biểu tượng khoá trên thanh địa chỉ và chọn Cho phép cho Micro.</p>' +
        '</div></div>';
      }

      function renderReview() {
        let answered = 0, partial = 0, empty = 0;

        const cells = QUESTIONS.map((q, i) => {
          const st = statusOf(q);
          if (st === 'answered') answered++;
          else if (st === 'partial') partial++;
          else empty++;

          const mark = st === 'answered' ? ICON.check : (st === 'partial' ? ICON.warn : ICON.cross);
          const note = st === 'answered'
            ? (q.kind === 'speaking' ? 'Đã thu âm' : 'Đã trả lời')
            : (st === 'partial' ? 'Thiếu ' + (totalSlots(q) - filledCount(q)) + ' ô' : 'Chưa làm');

          return '<button class="review-cell ' + (st === 'partial' ? 'is-partial' : (st === 'empty' ? 'is-empty' : '')) + '" type="button" data-goq="' + i + '">' +
            '<div style="display:flex;align-items:flex-start;justify-content:space-between">' +
              '<span class="review-n">' + pad2(i + 1) + '</span>' +
              '<span style="display:flex;align-items:center;gap:6px">' + (state.flags[q.id] ? ICON.flagOn : '') + mark + '</span>' +
            '</div>' +
            '<div><div class="review-sec">PHẦN ' + q.sectionNumeral + '</div><div class="review-state">' + note + '</div></div>' +
          '</button>';
        }).join('');

        const problems = [];
        QUESTIONS.forEach((q, i) => {
          const st = statusOf(q);
          if (st !== 'answered') problems.push(pad2(i + 1));
        });

        // Naming all thirteen is unreadable; name a handful and count the rest.
        const shown = problems.slice(0, 6);
        const extra = problems.length - shown.length;
        const list = shown.join(', ') + (extra > 0 ? ' và ' + extra + ' câu khác' : '');

        const callout = problems.length
          ? '<div class="callout">' + ICON.warn + '<span>Câu <strong>' + list + '</strong> chưa hoàn tất. Ô để trống sẽ được tính là sai.</span></div>'
          : '<div class="callout" style="border-color:#bbf7d0;background:#f0fdf4;color:#14532d">' + ICON.check + '<span>Tất cả ' + TOTAL + ' câu đã hoàn tất.</span></div>';

        return '<div class="sheet"><div class="sheet-inner">' +
          '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">' +
            '<div>' +
              '<h1 class="h1">Xem lại bài làm</h1>' +
              '<p class="lead">Nhấn vào bất kỳ câu nào để quay lại sửa. Sau khi nộp, bạn không thể thay đổi.</p>' +
            '</div>' +
            '<div class="stats">' +
              '<div class="stat"><span class="stat-n">' + answered + '</span><span class="stat-l">HOÀN TẤT</span></div>' +
              '<div class="stat"><span class="stat-n" style="color:#a16207">' + partial + '</span><span class="stat-l">THIẾU Ô</span></div>' +
              '<div class="stat"><span class="stat-n" style="color:#b91c1c">' + empty + '</span><span class="stat-l">CHƯA LÀM</span></div>' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:24px;height:1px;background:var(--line)"></div>' +
          '<div class="review-grid">' + cells + '</div>' +
          callout +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:34px;padding-top:24px;border-top:var(--bw) solid var(--line);flex-wrap:wrap">' +
            '<button class="btn" type="button" data-goq="' + state.q + '">← &nbsp;Quay lại làm tiếp</button>' +
            '<div style="display:flex;align-items:center;gap:20px">' +
              '<span style="font-size:13.5px;color:var(--muted)">Sau khi nộp, link sẽ bị khoá.</span>' +
              '<button class="btn btn-dark" type="button" data-go="submit">Nộp bài</button>' +
            '</div>' +
          '</div>' +
        '</div></div>';
      }

      function renderDone() {
        const steps = [
          ['Bài của bạn đang được chấm', 'Phần trắc nghiệm được chấm ngay; phần thu âm được nhận dạng và đối chiếu với đoạn văn gốc.'],
          ['Giáo viên xem lại kết quả', 'Một giáo viên sẽ nghe lại bản thu và xem chi tiết từng phần để đánh giá đúng trình độ của bạn.'],
          ['Trung tâm liên hệ với bạn', 'Bạn sẽ nhận được kết quả cùng lộ trình học được đề xuất riêng cho mình.']
        ];

        const tl = steps.map(([t, s], i) => '<div class="tl-row">' +
          '<div class="tl-rail"><div class="tl-n">' + (i + 1) + '</div>' + (i < steps.length - 1 ? '<div class="tl-line"></div>' : '') + '</div>' +
          '<div class="tl-body"><div class="tl-title">' + esc(t) + '</div><div class="tl-sub">' + esc(s) + '</div></div>' +
        '</div>').join('');

        return '<div class="sheet" style="justify-content:center"><div class="sheet-inner" style="max-width:620px;display:flex;flex-direction:column;align-items:center;text-align:center">' +
          '<div style="display:flex;align-items:center;justify-content:center;width:64px;height:64px;border:var(--bw) solid var(--line);border-radius:50%">' +
            '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>' +
          '</div>' +
          '<h1 class="h1" style="margin-top:24px;font-size:38px">Cảm ơn bạn!</h1>' +
          '<p class="lead" style="max-width:460px">Bạn đã hoàn thành và nộp bài kiểm tra đầu vào. Link này đã được khoá và không cần mở lại nữa.</p>' +
          '<div class="timeline" style="width:100%;max-width:520px;text-align:left">' + tl + '</div>' +
          '<p style="margin-top:24px;font-size:13.5px;color:var(--faint)">Bạn có thể đóng trang này.</p>' +
        '</div></div>';
      }

      // ═══════════════════════════════════════════════════════════════
      // Render
      // ═══════════════════════════════════════════════════════════════

      // ── Host integration ────────────────────────────────────────────
      // The lab runs inside the CRM's rating panel. It reports which page is
      // on screen so the host can bind its star ratings to it, and accepts a
      // font pair chosen once for the whole test.

      const SKIN = window.__ET_SKIN__ || 'b';

      const PAGE_LABELS = {
        intro: 'Màn hình chào',
        miccheck: 'Kiểm tra micro',
        speaking: 'Đọc & Nói',
        vocab: 'Từ vựng',
        grammar: 'Ngữ pháp',
        listening: 'Nghe & Viết',
        review: 'Xem lại bài làm',
        done: 'Đã nộp bài'
      };

      function currentPageId() {
        if (state.view !== 'question') return state.view;
        const q = QUESTIONS[state.q];
        if (q.kind === 'speaking') return 'speaking';
        if (q.sectionId === 'vocab') return 'vocab';
        if (q.sectionId === 'grammar') return 'grammar';
        return 'listening';
      }

      function reportPage() {
        if (window.parent === window) return;
        const id = currentPageId();
        try {
          window.parent.postMessage({
            type: 'etlab:page',
            skin: SKIN,
            page: id,
            label: PAGE_LABELS[id] || id
          }, window.location.origin);
        } catch (e) { /* host not listening */ }
      }

      function applyFonts(vnId, enId) {
        const cat = window.ENTRANCE_TEST_UI_FONTS;
        if (!cat) return;
        const root = document.documentElement;

        const vn = cat.vn.find(f => f.id === vnId);
        if (vn) { cat.ensure(vn.google); root.style.setProperty('--sans', vn.stack); }
        else { root.style.removeProperty('--sans'); }

        const en = cat.en.find(f => f.id === enId);
        if (en) { cat.ensure(en.google); root.style.setProperty('--serif', en.stack); }
        else { root.style.removeProperty('--serif'); }
      }

      window.addEventListener('message', (ev) => {
        if (ev.origin !== window.location.origin) return;
        const msg = ev.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'etlab:fonts') applyFonts(msg.vn, msg.en);
        if (msg.type === 'etlab:goto' && PAGE_LABELS[msg.page]) gotoPage(msg.page);
      });

      // Jump straight to a page so a rater can reach every screen without
      // playing the whole test through.
      function gotoPage(id) {
        if (id === 'intro' || id === 'miccheck' || id === 'review' || id === 'done') {
          stopRecording(true);
          state.view = id;
          render();
          return;
        }
        const first = { speaking: 0, vocab: 3, grammar: 7, listening: 11 }[id];
        if (typeof first === 'number') goQuestion(first);
      }

      (function bootFontsFromQuery() {
        const p = new URLSearchParams(location.search);
        if (p.get('vn') || p.get('en')) applyFonts(p.get('vn'), p.get('en'));
      })();

      function render() {
        const showNav = state.view === 'question';
        let stage;

        if (state.view === 'intro') stage = renderIntro();
        else if (state.view === 'miccheck') stage = renderMicCheck();
        else if (state.view === 'review') stage = renderReview();
        else if (state.view === 'done') stage = renderDone();
        else stage = renderQuestionView(QUESTIONS[state.q]);

        app.innerHTML = renderBar() +
          '<div class="body">' + (showNav ? renderNav() : '') + stage + '</div>' +
          renderFoot();

        if (state.view === 'question') {
          const q = QUESTIONS[state.q];
          if (q.audio) wireAudio();
          const activeRow = app.querySelector('.rail-row.is-active');
          if (activeRow && activeRow.scrollIntoView) activeRow.scrollIntoView({ block: 'nearest' });
        }

        reportPage();
      }

      // ═══════════════════════════════════════════════════════════════
      // Navigation + answering
      // ═══════════════════════════════════════════════════════════════

      function goQuestion(i) {
        stopRecording(true);
        state.q = Math.max(0, Math.min(TOTAL - 1, i));
