        state.view = 'question';
        const q = QUESTIONS[state.q];
        if (!state.active[q.id]) state.active[q.id] = 1;
        save();
        render();
      }

      function startTest() {
        const first = QUESTIONS[0];
        if (state.micCheckEnabled && !state.micChecked && first.kind === 'speaking') {
          state.view = 'miccheck';
          render();
          return;
        }
        goQuestion(state.q || 0);
      }

      function setAnswer(q, n, value) {
        const ans = answersFor(q);
        ans[n - 1] = value;
        save();
      }

      // Move to the next blank that still needs an answer, else stay.
      function advanceBlank(q, from) {
        const ans = answersFor(q);
        for (let i = from; i < q.blanks.length; i++) {
          if (!ans[i]) { state.active[q.id] = q.blanks[i].n; return; }
        }
        for (let i = 0; i < from; i++) {
          if (!ans[i]) { state.active[q.id] = q.blanks[i].n; return; }
        }
        state.active[q.id] = q.blanks[q.blanks.length - 1].n;
      }

      app.addEventListener('click', (ev) => {
        const t = ev.target.closest('[data-goq],[data-go],[data-slot],[data-pick],[data-flag],[data-rec],[data-mic],[data-audio]');
        if (!t) return;

        if (t.hasAttribute('data-goq')) { goQuestion(Number(t.getAttribute('data-goq'))); return; }

        if (t.hasAttribute('data-go')) {
          const go = t.getAttribute('data-go');
          if (go === 'start') { startTest(); return; }
          if (go === 'skipmic') { state.micChecked = true; save(); goQuestion(0); return; }
          if (go === 'review') { stopRecording(true); state.view = 'review'; render(); return; }
          if (go === 'submit') { stopRecording(true); state.view = 'done'; save(); render(); return; }
          return;
        }

        const q = QUESTIONS[state.q];

        if (t.hasAttribute('data-slot')) {
          state.active[q.id] = Number(t.getAttribute('data-slot'));
          save();
          render();
          return;
        }

        if (t.hasAttribute('data-pick')) {
          const n = Number(t.getAttribute('data-pick'));
          setAnswer(q, n, t.getAttribute('data-word'));
          advanceBlank(q, n);
          render();
          return;
        }

        if (t.hasAttribute('data-flag')) {
          if (state.flags[q.id]) delete state.flags[q.id]; else state.flags[q.id] = true;
          save();
          render();
          return;
        }

        if (t.hasAttribute('data-rec')) { handleRec(t.getAttribute('data-rec'), q); return; }
        if (t.hasAttribute('data-mic')) { startMicCheck(); return; }
      });

      // Listening blanks are typed in the passage itself. Update the counter and
      // the navigator in place rather than re-rendering, which would drop focus.
      app.addEventListener('input', (ev) => {
        const input = ev.target.closest('[data-fill]');
        if (!input) return;

        const q = QUESTIONS[state.q];
        setAnswer(q, Number(input.getAttribute('data-fill')), input.value);

        const filled = filledCount(q);
        const left = totalSlots(q) - filled;
        const status = app.querySelector('.fill-status');
        if (status) {
          const spans = status.children;
          spans[0].innerHTML = '<strong style="color:var(--ink);font-weight:600">' + filled + ' / ' + totalSlots(q) + '</strong> ô đã điền';
          spans[1].textContent = left > 0 ? 'Còn ' + left + ' ô' : 'Đã xong';
        }

        const row = app.querySelectorAll('.nav-row')[state.q];
        if (row) {
          const st = statusOf(q);
          row.classList.toggle('is-answered', st === 'answered');
          row.classList.toggle('is-partial', st === 'partial');
        }
      });

      app.addEventListener('focusin', (ev) => {
        const input = ev.target.closest('[data-fill]');
        if (!input) return;
        const q = QUESTIONS[state.q];
        if (q.kind !== 'mc') return; // listening has no rail to keep in sync
        const n = Number(input.getAttribute('data-fill'));
        if (state.active[q.id] === n) return;
        state.active[q.id] = n;
        app.querySelectorAll('.slot').forEach(sl => sl.classList.toggle('is-active', Number(sl.getAttribute('data-slot')) === n));
        app.querySelectorAll('.rail-row').forEach(r => r.classList.toggle('is-active', Number(r.getAttribute('data-row')) === n));
      });

      // A–D picks the active blank's option; arrows move between questions.
      document.addEventListener('keydown', (ev) => {
        if (state.view !== 'question') return;
        if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
        const tag = (ev.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') return;

        const q = QUESTIONS[state.q];
        if (q.kind === 'mc') {
          const key = ev.key.toUpperCase();
          const idx = 'ABCD'.indexOf(key);
          if (idx !== -1) {
            const n = state.active[q.id] || 1;
            const blank = q.blanks.find(b => b.n === n);
            if (blank && blank.shown[idx]) {
              ev.preventDefault();
              setAnswer(q, n, blank.shown[idx]);
              advanceBlank(q, n);
              render();
            }
            return;
          }
        }

        if (ev.key === 'ArrowRight' && state.q < TOTAL - 1) { ev.preventDefault(); goQuestion(state.q + 1); }
        if (ev.key === 'ArrowLeft' && state.q > 0) { ev.preventDefault(); goQuestion(state.q - 1); }
      });

      document.addEventListener('click', (ev) => {
        if (ev.target.closest('#nav-toggle')) {
          const nav = document.getElementById('nav');
          if (nav) nav.classList.toggle('is-open');
        }
      });

      // ═══════════════════════════════════════════════════════════════
      // Audio
      // ═══════════════════════════════════════════════════════════════

      const RATES = [1, 0.75, 1.25];

      function wireAudio() {
        const wrap = app.querySelector('[data-player]');
        if (!wrap) return;
        const audio = wrap.querySelector('audio');
        const bars = Array.from(wrap.querySelectorAll('.wave span'));
        const timeEl = wrap.querySelector('[data-audio="time"]');
        const btn = wrap.querySelector('[data-audio="toggle"]');
        const rateBtn = wrap.querySelector('[data-audio="rate"]');
        const playsEl = wrap.querySelector('[data-audio="plays"]');
        const q = QUESTIONS[state.q];
        let rateIndex = 0;

        function paint() {
          const d = audio.duration || 0;
          const ratio = d ? audio.currentTime / d : 0;
          bars.forEach((b, i) => b.classList.toggle('is-played', i / bars.length < ratio));
          timeEl.textContent = mmss(audio.currentTime) + ' / ' + (d ? mmss(d) : '--:--');
        }

        audio.addEventListener('loadedmetadata', paint);
        audio.addEventListener('timeupdate', paint);
        audio.addEventListener('ended', () => { btn.innerHTML = ICON.play; paint(); });
        audio.addEventListener('error', () => {
          timeEl.textContent = 'không tải được';
          wrap.style.borderColor = 'var(--danger-line)';
        });

        btn.addEventListener('click', () => {
          if (audio.paused) {
            audio.play().then(() => {
              btn.innerHTML = ICON.pause;
              state.plays[q.id] = (state.plays[q.id] || 0) + 1;
              playsEl.textContent = 'NGHE ' + state.plays[q.id] + ' LẦN';
              save();
            }).catch(() => { timeEl.textContent = 'không phát được'; });
          } else {
            audio.pause();
            btn.innerHTML = ICON.play;
          }
        });

        rateBtn.addEventListener('click', () => {
          rateIndex = (rateIndex + 1) % RATES.length;
          audio.playbackRate = RATES[rateIndex];
          rateBtn.textContent = RATES[rateIndex].toFixed(2).replace(/0$/, '') + '×';
        });

        wrap.querySelector('[data-audio="seek"]').addEventListener('click', (ev) => {
          const box = ev.currentTarget.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (ev.clientX - box.left) / box.width));
          if (audio.duration) { audio.currentTime = ratio * audio.duration; paint(); }
        });

        paint();
      }

      // ═══════════════════════════════════════════════════════════════
      // Microphone — real getUserMedia, real level meter, real recording
      // ═══════════════════════════════════════════════════════════════

      function meterLoop(el, analyser, bars) {
        const data = new Uint8Array(analyser.frequencyBinCount);
        function tick() {
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const level = Math.min(1, (sum / data.length) / 90);
          const lit = Math.round(level * bars.length);
          bars.forEach((b, i) => b.classList.toggle('is-lit', i < lit));
          rec.raf = requestAnimationFrame(tick);
        }
        tick();
      }

      async function openMic() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Trình duyệt này không hỗ trợ thu âm.');
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        ctx.createMediaStreamSource(stream).connect(analyser);
        rec.stream = stream; rec.ctx = ctx; rec.analyser = analyser;
        return stream;
      }

      async function startMicCheck() {
        const status = document.getElementById('mic-status');
        const meter = document.getElementById('mic-meter');
        try {
          await openMic();
          const bars = Array.from(meter.querySelectorAll('span'));
          meterLoop(meter, rec.analyser, bars);
          status.innerHTML = '<span style="color:#15803d;font-weight:500">Micro đang hoạt động — hãy thử nói vài từ.</span>';
          const btn = app.querySelector('[data-mic="start"]');
          if (btn) {
            btn.textContent = 'Micro ổn, bắt đầu phần Nói';
            btn.setAttribute('data-mic', '');
            btn.setAttribute('data-go', 'skipmic');
          }
        } catch (e) {
          status.innerHTML = '<span style="color:#b91c1c;font-weight:500">Không truy cập được micro: ' + esc(e.message || 'bị từ chối') + '</span>';
        }
      }

      function stopRecording(silent) {
        if (rec.raf) { cancelAnimationFrame(rec.raf); rec.raf = 0; }
        if (rec.recorder && rec.recorder.state === 'recording') {
          rec.recorder.stop();
        } else if (silent) {
          releaseMic();
        }
      }

      function releaseMic() {
        if (rec.stream) { rec.stream.getTracks().forEach(t => t.stop()); rec.stream = null; }
        if (rec.ctx && rec.ctx.close) { rec.ctx.close().catch(() => {}); rec.ctx = null; }
        rec.analyser = null;
      }

      function pickMime() {
        const apple = /iPad|iPhone|iPod|Macintosh/i.test(navigator.userAgent || '')
          || /^((?!chrome|android).)*safari/i.test(navigator.userAgent || '');
        const order = apple
          ? ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']
          : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
        for (const m of order) {
          if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
        }
        return '';
      }

      async function handleRec(action, q) {
        if (action === 'stop') { stopRecording(false); return; }

        if (action === 'again') {
          const take = state.speaking[q.id];
          if (take && take.url) URL.revokeObjectURL(take.url);
          delete state.speaking[q.id];
          render();
          return;
        }

        try {
          await openMic();
          const mime = pickMime();
          const recorder = new MediaRecorder(rec.stream, mime ? { mimeType: mime } : undefined);
          rec.recorder = recorder;
          rec.qid = q.id;
          rec.chunks = [];
          rec.startedAt = Date.now();

          recorder.ondataavailable = (e) => { if (e.data && e.data.size) rec.chunks.push(e.data); };
          recorder.onstop = () => {
            const seconds = (Date.now() - rec.startedAt) / 1000;
            const blob = new Blob(rec.chunks, { type: mime || 'audio/webm' });
            state.speaking[q.id] = { url: URL.createObjectURL(blob), seconds };
            rec.recorder = null;
            rec.qid = null;
            releaseMic();
            save();
            render();
          };

          recorder.start();
          render();

          const meter = document.getElementById('rec-meter');
          const timer = document.getElementById('rec-timer');
          if (meter) {
            meter.innerHTML = waveBars('live', 60, 44).map(h => '<span style="height:' + h + 'px"></span>').join('');
            meterLoop(meter, rec.analyser, Array.from(meter.querySelectorAll('span')));
          }
          if (timer) {
            const tick = () => {
              if (!rec.recorder) return;
              const s = Math.floor((Date.now() - rec.startedAt) / 1000);
              timer.textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
              setTimeout(tick, 250);
            };
            tick();
          }
        } catch (e) {
          releaseMic();
          alert('Không truy cập được micro: ' + (e.message || 'bị từ chối') +
            '\n\nNhấn biểu tượng khoá trên thanh địa chỉ và chọn Cho phép cho Micro.');
        }
      }

      // ═══════════════════════════════════════════════════════════════
      // Prototype test panel
      // ═══════════════════════════════════════════════════════════════

      const panel = document.getElementById('test-panel');
      document.getElementById('test-toggle').addEventListener('click', () => panel.classList.toggle('is-open'));

      document.getElementById('test-miccheck').addEventListener('change', (e) => {
        state.micCheckEnabled = e.target.checked;
      });

      function fillEverything(leaveGaps) {
        QUESTIONS.forEach((q, qi) => {
          if (q.kind === 'speaking') {
            if (!(leaveGaps && qi === 0)) state.speaking[q.id] = state.speaking[q.id] || { url: '', seconds: 22 };
            return;
          }
          const ans = answersFor(q);
          q.blanks.forEach((b, bi) => {
            if (leaveGaps && qi === 3 && bi >= 2) { ans[bi] = ''; return; }
            ans[bi] = b.answer;
          });
        });
        if (leaveGaps) {
          const last = QUESTIONS[TOTAL - 1];
          state.answers[last.id] = new Array(blankCount(last)).fill('');
        }
        save();
      }

      panel.addEventListener('click', (ev) => {
        const btn = ev.target.closest('[data-test]');
        if (!btn) return;
        const what = btn.getAttribute('data-test');

        if (what === 'reset') {
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          Object.keys(state.speaking).forEach(k => { if (state.speaking[k].url) URL.revokeObjectURL(state.speaking[k].url); });
          state.answers = {}; state.flags = {}; state.active = {}; state.speaking = {}; state.plays = {};
          state.q = 0; state.micChecked = false; state.view = 'intro';
        } else if (what === 'fill-all') {
          fillEverything(false);
          state.view = 'question';
        } else if (what === 'fill-most') {
          fillEverything(true);
          state.flags[QUESTIONS[6].id] = true;
          state.view = 'question';
        } else if (what === 'review') {
          state.view = 'review';
        } else if (what === 'done') {
          state.view = 'done';
        }

        panel.classList.remove('is-open');
        save();
        render();
      });

      // ═══════════════════════════════════════════════════════════════

      load();
      state.savedAt = new Date();
      render();
    })();
  </script>
</body>

</html>
