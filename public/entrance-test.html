<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Entrance Test</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="entrance-test.css?v=20260212b" />
</head>

<body>
  <div class="et-shell">
    <header class="et-header">
      <div class="et-brand">
        <img class="et-logo" src="/database/Logo.png" alt="Better English Learning" width="48" height="48">
        <div class="et-brand-text">
          <div class="et-brand-title">Entrance Test</div>
          <div id="et-brand-subtitle" class="et-brand-subtitle">Loading…</div>
        </div>
      </div>

      <div class="et-progress">
        <div id="et-progress-text" class="et-progress-text">—</div>
        <div class="et-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="et-progress-fill" class="et-progress-fill"></div>
        </div>
      </div>
    </header>

    <main class="et-main">
      <div id="et-card" class="et-card">
        <div class="et-loading">
          <div class="et-spinner" aria-hidden="true"></div>
          <div class="et-loading-text">Checking your link…</div>
        </div>
      </div>
    </main>
  </div>

  <script src="entrance-test.js?v=20260212b"></script>
</body>

</html>
