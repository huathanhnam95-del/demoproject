<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Crossing (2.5D Overhaul)</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            /* Match game bg */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }

        #penguin-game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            /* Flex to center canvas */
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
        }

        canvas {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        /* Hide close button for standalone mode */
        #close-penguin-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 4px;
            font-family: sans-serif;
        }
    </style>
    <!-- Preload fonts to avoid FOUT -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Georgia:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Overlay Container matching penguin-crossing.js expectations -->
    <div id="penguin-game-overlay">
        <div id="close-penguin-btn">Close (ESC)</div>
        <canvas id="penguin-canvas" width="800" height="600"></canvas>
    </div>

    <!-- Main Game Script -->
    <script type="module" src="./penguin-crossing.js"></script>

    <!-- Auto-start script -->
    <script>
        // Start game once module is loaded
        window.addEventListener('load', () => {
            console.log('Page loaded, attempting to start game...');
            // Polling for window.openPenguinGame just in case of race condition
            const interval = setInterval(() => {
                if (typeof window.openPenguinGame === 'function') {
                    clearInterval(interval);
                    console.log('Starting Penguin Crossing...');
                    window.openPenguinGame();
                }
            }, 100);
        });

        // ESC to close (simulates close button for testing)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r') {
                // Reload page helper
                location.reload();
            }
        });
    </script>
</body>

</html>
