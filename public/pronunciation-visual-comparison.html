<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronunciation Dual Arena - Option A vs. Option B Comparison</title>
  <link rel="stylesheet" href="crm-admin.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #f9fafb;
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .standalone-container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .standalone-header-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1f2937;
    }
    .standalone-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .standalone-logo {
      font-size: 1.8rem;
    }
    .standalone-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #f9fafb;
    }
    .standalone-subtitle {
      margin: 2px 0 0 0;
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .standalone-links {
      display: flex;
      gap: 12px;
    }
    .standalone-link-btn {
      padding: 8px 14px;
      border-radius: 6px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #f9fafb;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }
    .standalone-link-btn:hover {
      background: #374151;
      border-color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="standalone-container">
    <header class="standalone-header-banner">
      <div class="standalone-logo-wrap">
        <span class="standalone-logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" x2="12" y1="19" y2="22"></line>
          </svg>
        </span>
        <div>
          <h1 class="standalone-title">Pronunciation Assessment Dual Arena</h1>
          <p class="standalone-subtitle">Standalone Unauthenticated Test Runner: Option A (Azure + Praat Fusion) vs. Option B (Repaired V4 + Praat Native)</p>
        </div>
      </div>
      <div class="standalone-links">
        <a href="/crm-admin.html#pronunciation-samples" class="standalone-link-btn">Admin Portal</a>
      </div>
    </header>

    <main id="pronunciation-dual-arena-mount"></main>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7.12.6"></script>
  <script src="js/crm/pronunciation-dual-arena.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const mount = document.getElementById('pronunciation-dual-arena-mount');
      if (mount && window.PronunciationDualArena) {
        new window.PronunciationDualArena(mount);
      }
    });
  </script>
</body>
</html>
