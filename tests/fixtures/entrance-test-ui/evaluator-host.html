<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrance Test UI evaluator fixture</title>
    <link rel="stylesheet" href="/crm-admin.css">
    <style>
      body { margin: 0; padding: 24px; background: #f8fafc; font-family: system-ui, sans-serif; }
      #entrance-test-ui-root { max-width: 1280px; margin: 0 auto; }
    </style>
  <link rel="stylesheet" href="/css/entrance-test-ui-annotations.css">
  </head>
  <body>
    <main id="entrance-test-ui-root" class="et-ui" aria-label="Entrance Test UI evaluator"></main>
    <script>
      // Synthetic rating adapter. Never references a production Firebase project.
      const ratingDocs = new Map();
      const fixtureStore = {
        collection: () => ({ doc: id => ({ id, get: async () => ({exists: ratingDocs.has(id), data: () => structuredClone(ratingDocs.get(id))}) }) }),
        runTransaction: async fn => fn({get: ref => ref.get(),set: (ref,data) => ratingDocs.set(ref.id,structuredClone(data))})
      };
      window.fixtureRatings = ratingDocs;
      window.firebase = {firestore: Object.assign(() => fixtureStore,{FieldValue:{serverTimestamp:()=>Date.now()}})};
    </script>
    <script src="/js/entrance-test-ui-fonts.js"></script>
    <script src="/js/crm/entrance-test-ui-lab.js"></script>
    <script>window.addEventListener('DOMContentLoaded', function () { window.CrmEntranceTestUiLab.boot(); });</script>
  </body>
</html>
